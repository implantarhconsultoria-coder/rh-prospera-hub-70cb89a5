<html lang="pt-BR" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta property="og:title" content="Topac RH PRO | Plataforma Multiempresas">
  <meta name="twitter:title" content="Topac RH PRO | Plataforma Multiempresas">
  <meta property="og:description" content="Topac RH — Plataforma central de RH, DP e controle operacional multiempresa.">
  <meta name="twitter:description" content="Topac RH — Plataforma central de RH, DP e controle operacional multiempresa.">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=20260524-2">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=20260524-2">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=20260524-2">
  <link rel="manifest" href="/manifest.json?v=20260605-acesso-final-1">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TOPAC RH PRO">
</head>

  <body class="notranslate" translate="no">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (() => {
        const parseMoney = (value) => {
          const normalized = String(value || '')
            .replace(/[^0-9,.-]/g, '')
            .replace(/\./g, '')
            .replace(',', '.');
          return Number(normalized) || 0;
        };

        const money = (value) => new Intl.NumberFormat('pt-BR', {
          style: 'currency',
          currency: 'BRL',
        }).format(value || 0);

        const createCard = (label, value, tone) => {
          const card = document.createElement('div');
          card.style.cssText = 'border:1px solid hsl(var(--border));border-radius:10px;padding:12px;background:hsl(var(--background));min-width:0;';
          const title = document.createElement('div');
          title.textContent = label;
          title.style.cssText = 'font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:hsl(var(--muted-foreground));font-weight:600;';
          const amount = document.createElement('div');
          amount.textContent = money(value);
          amount.style.cssText = `font-size:20px;font-weight:800;margin-top:4px;color:${tone};`;
          card.append(title, amount);
          return card;
        };

        const setReactInputValue = (input, value) => {
          if (!input) return;
          const descriptor = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value');
          descriptor?.set?.call(input, String(value));
          input.dispatchEvent(new Event('input', { bubbles: true }));
          input.dispatchEvent(new Event('change', { bubbles: true }));
        };

        const findInputByLabel = (labelText) => {
          const label = [...document.querySelectorAll('label')].find((node) =>
            node.textContent.trim().toLowerCase().startsWith(labelText.toLowerCase())
          );
          return label?.parentElement?.querySelector('input') || null;
        };

        const parseLocalDate = (value) => {
          const match = String(value || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
          if (!match) return null;
          return new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]), 12);
        };

        const completedYears = (start, end) => {
          let years = end.getFullYear() - start.getFullYear();
          const anniversary = new Date(end.getFullYear(), start.getMonth(), start.getDate(), 12);
          if (end < anniversary) years -= 1;
          return Math.max(0, years);
        };

        let lastAutoFillKey = '';
        const autoFillRescisao = () => {
          const dialogTitle = [...document.querySelectorAll('[role="dialog"] *')].find((node) =>
            node.childElementCount === 0 && node.textContent.trim() === 'Nova Rescisao'
          );
          if (!dialogTitle) {
            lastAutoFillKey = '';
            return;
          }

          const dialog = dialogTitle.closest('[role="dialog"]');
          if (!dialog) return;
          const info = [...dialog.querySelectorAll('div')].find((node) =>
            node.textContent.includes('Admissao:') && node.textContent.includes('Salario:')
          );
          const dateInput = [...dialog.querySelectorAll('input[type="date"]')][0];
          if (!info || !dateInput?.value) return;

          const admissionMatch = info.textContent.match(/Admissao:\s*(\d{4}-\d{2}-\d{2})/i);
          const salaryMatch = info.textContent.match(/Salario:\s*R\$\s*([\d.]+,\d{2})/i);
          if (!admissionMatch || !salaryMatch) return;

          const admission = parseLocalDate(admissionMatch[1]);
          const termination = parseLocalDate(dateInput.value);
          const salary = parseMoney(salaryMatch[1]);
          if (!admission || !termination || termination < admission || salary <= 0) return;

          const key = `${admissionMatch[1]}|${dateInput.value}|${salary}`;
          if (key === lastAutoFillKey) return;
          lastAutoFillKey = key;

          const totalDays = Math.max(1, Math.floor((termination.getTime() - admission.getTime()) / 86400000) + 1);
          const estimatedMonths = totalDays / 30;
          const estimatedFgts = Math.round((salary * 0.08 * estimatedMonths) * 100) / 100;
          const overdueVacationMonths = completedYears(admission, termination) * 12;

          const fgtsInput = findInputByLabel('Saldo FGTS depositado');
          const vacationInput = findInputByLabel('Meses de ferias vencidas');
          setReactInputValue(fgtsInput, estimatedFgts.toFixed(2).replace('.', ','));
          setReactInputValue(vacationInput, overdueVacationMonths);

          const fgtsLabel = fgtsInput?.parentElement?.querySelector('label');
          if (fgtsLabel) fgtsLabel.textContent = 'Saldo FGTS estimado (R$) — editável';
          const vacationLabel = vacationInput?.parentElement?.querySelector('label');
          if (vacationLabel) vacationLabel.textContent = 'Meses de férias vencidas estimados — editável';
        };

        const enhance = () => {
          autoFillRescisao();
          const titles = [...document.querySelectorAll('div')].filter((node) =>
            node.childElementCount === 0 && node.textContent.trim() === 'Previa dos calculos'
          );

          titles.forEach((title) => {
            const panel = title.parentElement;
            if (!panel) return;

            const rows = [...panel.children].filter((child) => child !== title && child.querySelectorAll('span').length >= 2);
            const values = new Map();
            rows.forEach((row) => {
              const spans = row.querySelectorAll('span');
              if (spans.length < 2) return;
              values.set(spans[0].textContent.trim().toLowerCase(), parseMoney(spans[1].textContent));
            });

            const getByStart = (prefix) => {
              for (const [label, value] of values.entries()) {
                if (label.startsWith(prefix)) return value;
              }
              return 0;
            };

            const totalProventos =
              getByStart('saldo de salario') +
              getByStart('aviso previo indenizado') +
              getByStart('ferias vencidas') +
              getByStart('ferias proporcionais') +
              getByStart('1/3 ferias') +
              getByStart('13o proporcional');

            const totalDescontos =
              getByStart('(-) inss') +
              getByStart('(-) irrf') +
              getByStart('(-) outros');

            title.textContent = 'Calculo automatico em tempo real';
            title.style.marginBottom = '0';

            let summary = panel.querySelector('[data-rescisao-summary="true"]');
            if (!summary) {
              summary = document.createElement('div');
              summary.dataset.rescisaoSummary = 'true';
              summary.style.cssText = 'display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0;';
              title.insertAdjacentElement('afterend', summary);
            }
            summary.replaceChildren(
              createCard('Base de remuneracao', getByStart('base de remuneracao'), 'hsl(var(--foreground))'),
              createCard('Total de proventos', totalProventos, 'hsl(var(--success))'),
              createCard('Total de descontos', totalDescontos, 'hsl(var(--destructive))')
            );

            const liquidRow = rows.find((row) => row.querySelector('span')?.textContent.trim() === 'Liquido');
            if (liquidRow) {
              liquidRow.querySelector('span').textContent = 'Liquido estimado';
              liquidRow.style.cssText += ';border:2px solid color-mix(in srgb,hsl(var(--success)) 35%,transparent);border-radius:10px;padding:12px;margin-top:12px;background:color-mix(in srgb,hsl(var(--success)) 7%,transparent);';
            }

            let manual = panel.querySelector('[data-rescisao-manual="true"]');
            if (!manual) {
              manual = document.createElement('div');
              manual.dataset.rescisaoManual = 'true';
              manual.style.cssText = 'margin-top:10px;padding:10px;border:1px solid rgba(245,158,11,.35);border-radius:9px;background:rgba(245,158,11,.06);font-size:12px;';
              manual.innerHTML = '<strong>Conferencia manual:</strong> o FGTS e as ferias sao estimados automaticamente e permanecem editaveis. Confirme os valores reais antes do envio.<br><span style="color:hsl(var(--muted-foreground))">Previa estimada. O calculo oficial deve ser validado pela contabilidade.</span>';
              panel.appendChild(manual);
            }
          });
        };

        let scheduled = false;
        const observer = new MutationObserver(() => {
          if (scheduled) return;
          scheduled = true;
          requestAnimationFrame(() => {
            scheduled = false;
            enhance();
          });
        });

        observer.observe(document.documentElement, { childList: true, subtree: true, characterData: true });
        window.addEventListener('DOMContentLoaded', enhance);
        setTimeout(enhance, 1000);
      })();
    </script>
  </body>
</html>
