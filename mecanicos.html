<html lang="pt-BR" translate="no">

    <meta charset="UTF-8" />

    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#030818" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TOPAC Mecânicos" />
    <meta name="application-name" content="TOPAC Mecânicos" />

    <link rel="icon" type="image/svg+xml" href="/icons/topac-mecanicos-new.svg?v=20260908-final-1" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="TOPAC Mecânicos" />
    <meta property="og:description" content="Acesso exclusivo da equipe operacional TOPAC." />
  </head>
  <body class="notranslate" translate="no">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (() => {
        const mechanicLogo = '/icons/topac-mecanicos-new.svg?v=20260908-final-1';
        const fixLogo = () => document.querySelectorAll('img[src*="topac-rh-pro"],img[alt="TOPAC RH PRO"]').forEach((img) => { img.src = mechanicLogo; img.alt = 'TOPAC Mecânicos'; });
        new MutationObserver(fixLogo).observe(document.documentElement, { childList: true, subtree: true });
        window.addEventListener('DOMContentLoaded', fixLogo);
        setTimeout(fixLogo, 300);
      })();
    </script>
  </body>
