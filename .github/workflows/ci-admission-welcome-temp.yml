name: CI Admission Welcome Temp
on:
  push:
    branches: [feat/admission-welcome-20261013]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps
      - name: Aplicar patches de build
        run: node scripts/fix-vr-employee-shortcut-build.mjs
      - name: Testes boas-vindas
        run: npx vitest run src/lib/__tests__/admissionWelcome.test.ts src/lib/__tests__/formatDate.test.ts
      - name: Typecheck
        run: npx tsc --noEmit --pretty false
      - name: Lint do código novo
        run: npx eslint src/lib/admissionWelcome.ts src/components/AdmissionWelcomeDialog.tsx src/lib/__tests__/admissionWelcome.test.ts
      - name: Build
        run: npm run build
