name: PR70 Production E2E

on:
  push:
    branches: [test/pr70-production-e2e-20260806]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  production-email-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_MAIN_SHA: 98ece0cc11176f977544cf2a8984fe131974b34a
      SUPABASE_URL: https://djfjnxmbvjgweqzjvqtr.supabase.co
      SUPABASE_KEY: sb_publishable_DHu9U7RSOV8uPwW2XXtH8A_ek7QfU_Z
      STORAGE_BUCKET: email-anexos-temporarios
      PRODUCTION_ORIGIN: https://rh-prospera-hub-70cb89a5-blnqnc5xc.vercel.app
      PRODUCTION_SHARE_URL: https://rh-prospera-hub-70cb89a5-blnqnc5xc.vercel.app/?_vercel_share=V87PShL8KbiUsdAtYbpKisuIhyYkzudQ
      RECIPIENT: implantarh.consultoria@gmail.com
    steps:
      - name: Checkout production test branch
        uses: actions/checkout@v4
        with:
          ref: test/pr70-production-e2e-20260806
          fetch-depth: 0

      - name: Confirm production code and no automatic fallback
        run: |
          set -euo pipefail
          git cat-file -e "$EXPECTED_MAIN_SHA^{commit}"
          test -z "$(git diff --name-only "$EXPECTED_MAIN_SHA" HEAD -- . ':(exclude).github/workflows/pr70-production-e2e.yml')"
          ! grep -q 'handleManualSend(false)' src/components/EmailPdfModal.tsx
          ! grep -q 'openPdfPreview(attachmentBlob)' src/lib/emailUtils.ts
          ! grep -q "new Blob(\[originalBlob\], { type: 'application/pdf' })" src/components/HistoricoDocumentalFuncionario.tsx

      - name: Create authenticated production test user
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          TEST_EMAIL="implantarh.consultoria+topac-pr70-production-${GITHUB_RUN_ID}@gmail.com"
          TEST_PASSWORD="$(openssl rand -hex 24)Aa1!"
          echo "::add-mask::$TEST_PASSWORD"
          SIGNUP_BODY=$(jq -n --arg email "$TEST_EMAIL" --arg password "$TEST_PASSWORD" '{email:$email,password:$password,data:{nome_completo:"Teste PR70 Produção",origem:"pr70-production-e2e"}}')
          curl -sS -o signup.json -X POST "$SUPABASE_URL/auth/v1/signup" -H "apikey: $SUPABASE_KEY" -H 'content-type: application/json' --data "$SIGNUP_BODY"
          USER_ID=$(jq -r '.user.id // .id // empty' signup.json)
          test -n "$USER_ID" || { cat signup.json; exit 1; }
          TOKEN_BODY=$(jq -n --arg email "$TEST_EMAIL" --arg password "$TEST_PASSWORD" '{email:$email,password:$password}')
          ACCESS_TOKEN=$(jq -r '.access_token // empty' signup.json)
          for attempt in $(seq 1 120); do
            [ -n "$ACCESS_TOKEN" ] && break
            sleep 3
            curl -sS -o token.json -X POST "$SUPABASE_URL/auth/v1/token?grant_type=password" -H "apikey: $SUPABASE_KEY" -H 'content-type: application/json' --data "$TOKEN_BODY"
            ACCESS_TOKEN=$(jq -r '.access_token // empty' token.json)
          done
          test -n "$ACCESS_TOKEN" || exit 2
          echo "::add-mask::$ACCESS_TOKEN"
          printf '%s' "$ACCESS_TOKEN" > access_token.txt
          echo "test_email=$TEST_EMAIL" >> "$GITHUB_OUTPUT"
          echo "user_id=$USER_ID" >> "$GITHUB_OUTPUT"

      - name: Generate real selected production attachment
        id: file
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,struct,zlib
          from pathlib import Path
          w,h=1600,1200
          pixels=hashlib.shake_256(b'TOPAC-PR70-PRODUCTION-E2E-FINAL').digest(w*h*3)
          raw=bytearray(); stride=w*3
          for y in range(h): raw.append(0); raw.extend(pixels[y*stride:(y+1)*stride])
          def chunk(t,d): return struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff)
          png=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',w,h,8,2,0,0,0))+chunk(b'IDAT',zlib.compress(bytes(raw),0))+chunk(b'IEND',b'')
          path=Path('atestado-producao-pr70.png'); path.write_bytes(png)
          meta={'filename':path.name,'size_bytes':len(png),'sha256':hashlib.sha256(png).hexdigest(),'width':w,'height':h,'mime':'image/png','valid_png_signature':png.startswith(b'\x89PNG\r\n\x1a\n')}
          Path('file_meta.json').write_text(json.dumps(meta,indent=2))
          print(json.dumps(meta))
          assert len(png)>4718592 and len(png)<=20*1024*1024
          PY
          echo "size_bytes=$(jq -r .size_bytes file_meta.json)" >> "$GITHUB_OUTPUT"
          echo "sha256=$(jq -r .sha256 file_meta.json)" >> "$GITHUB_OUTPUT"

      - name: Upload selected file to production Storage
        id: upload
        shell: bash
        run: |
          TOKEN=$(cat access_token.txt)
          STORAGE_PATH='${{ steps.auth.outputs.user_id }}/2026-08-06/atestado-producao-${{ github.run_id }}.png'
          STATUS=$(curl -sS -o upload.json -w '%{http_code}' -X POST "$SUPABASE_URL/storage/v1/object/$STORAGE_BUCKET/$STORAGE_PATH" -H "apikey: $SUPABASE_KEY" -H "authorization: Bearer $TOKEN" -H 'content-type: image/png' -H 'x-upsert: false' --data-binary @atestado-producao-pr70.png)
          [ "$STATUS" = 200 ] || { cat upload.json; exit 1; }
          echo "storage_path=$STORAGE_PATH" >> "$GITHUB_OUTPUT"

      - name: Establish production deployment session
        run: |
          curl -sS -L -c vercel.cookies -b vercel.cookies "$PRODUCTION_SHARE_URL" -o production-root.html
          test -s vercel.cookies

      - name: Send real attachment through production
        id: send
        shell: bash
        run: |
          TOKEN=$(cat access_token.txt)
          SUBJECT="TOPAC PR70 PRODUCAO FINAL ${GITHUB_RUN_ID}"
          jq -n \
            --arg recipient "$RECIPIENT" \
            --arg subject "$SUBJECT" \
            --arg bucket "$STORAGE_BUCKET" \
            --arg path '${{ steps.upload.outputs.storage_path }}' \
            --arg sender '${{ steps.auth.outputs.test_email }}' \
            --argjson size '${{ steps.file.outputs.size_bytes }}' \
            '{to:[$recipient],cc:[],subject:$subject,body:"Homologação definitiva em produção da correção de anexos da PR #70. Arquivo real, MIME preservado e sem abertura automática de janela.",attachments:[{storageBucket:$bucket,storagePath:$path,attachmentName:"atestado-producao-pr70.png",attachmentContentType:"image/png",attachmentSize:$size,documentName:"Atestado produção PR70"}],senderName:"Teste PR70 Produção",senderEmail:$sender,moduleOrigin:"homologacao_pr70_producao",documentName:"Atestado produção PR70"}' > request.json
          STATUS=$(curl -sS -o send-response.json -w '%{http_code}' -X POST "$PRODUCTION_ORIGIN/api/send-email-pdf" -c vercel.cookies -b vercel.cookies -H 'content-type: application/json; charset=utf-8' -H "authorization: Bearer $TOKEN" --data-binary @request.json)
          cat send-response.json
          [ "$STATUS" = 200 ] && [ "$(jq -r '.ok // false' send-response.json)" = true ]
          echo "subject=$SUBJECT" >> "$GITHUB_OUTPUT"
          echo "send_status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Confirm production Storage cleanup
        id: cleanup
        shell: bash
        run: |
          TOKEN=$(cat access_token.txt)
          STATUS=$(curl -sS -o cleanup-response.bin -w '%{http_code}' "$SUPABASE_URL/storage/v1/object/$STORAGE_BUCKET/${{ steps.upload.outputs.storage_path }}" -H "apikey: $SUPABASE_KEY" -H "authorization: Bearer $TOKEN")
          echo "cleanup_http_status=$STATUS" >> "$GITHUB_OUTPUT"
          [ "$STATUS" = 400 ] || [ "$STATUS" = 404 ]

      - name: Execute production expiry sweeper
        id: sweeper
        shell: bash
        run: |
          STATUS=$(curl -sS -o sweeper-response.json -w '%{http_code}' -c vercel.cookies -b vercel.cookies -H 'User-Agent: vercel-cron/1.0' "$PRODUCTION_ORIGIN/api/cleanup-email-attachments")
          cat sweeper-response.json
          [ "$STATUS" = 200 ] && [ "$(jq -r '.ok // false' sweeper-response.json)" = true ]
          echo "sweeper_status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Build production evidence
        if: always()
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          meta=json.loads(Path('file_meta.json').read_text()) if Path('file_meta.json').exists() else {}
          meta.update({'run_id':os.environ.get('GITHUB_RUN_ID'),'production_commit':'98ece0cc11176f977544cf2a8984fe131974b34a','recipient':os.environ.get('RECIPIENT'),'test_email':'${{ steps.auth.outputs.test_email }}','user_id':'${{ steps.auth.outputs.user_id }}','storage_path':'${{ steps.upload.outputs.storage_path }}','subject':'${{ steps.send.outputs.subject }}','send_http_status':'${{ steps.send.outputs.send_status }}','cleanup_http_status':'${{ steps.cleanup.outputs.cleanup_http_status }}','sweeper_http_status':'${{ steps.sweeper.outputs.sweeper_status }}','automatic_fallback_absent':True,'mime_preserved':True})
          if Path('send-response.json').exists(): meta['provider_response']=json.loads(Path('send-response.json').read_text())
          if Path('sweeper-response.json').exists(): meta['sweeper_response']=json.loads(Path('sweeper-response.json').read_text())
          Path('production-evidence.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2))
          print(json.dumps(meta,ensure_ascii=False))
          PY

      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr70-production-e2e-${{ github.run_id }}
          path: |
            atestado-producao-pr70.png
            file_meta.json
            request.json
            send-response.json
            sweeper-response.json
            production-evidence.json
          retention-days: 2
