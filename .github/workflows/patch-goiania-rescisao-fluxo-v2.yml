name: Patch Goiania Rescisao Fluxo V2

on:
  push:
    branches:
      - fix/goiania-rescisao-fluxo-1709-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/goiania-rescisao-fluxo-1709-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar ajustes de Goiania
        run: |
          python - <<'PY'
          from pathlib import Path

          def must_replace(path, old, new, count=1):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'Padrao nao encontrado em {path}: {old[:140]!r}')
              p.write_text(s.replace(old, new, count))

          # 1) A carta deixa de existir como enhancer global/flutuante.
          p = Path('src/main.tsx')
          s = p.read_text()
          s = s.replace('const PedidoDemissaoModelDialog = lazy(() => import("@/components/PedidoDemissaoModelDialog"));\n', '')
          s = s.replace("  const isPedidoDemissao = path === '/admin/rescisoes' || path === '/admin/funcionarios' || centralModule === 'rescisao';\n", '')
          s = s.replace(' && !isPedidoDemissao', '')
          s = s.replace('      {isPedidoDemissao && <PedidoDemissaoModelDialog />}\n', '')
          p.write_text(s)

          # 2) Regras centralizadas para Goiania.
          p = Path('src/lib/emailUtils.ts')
          s = p.read_text()
          if "EMAIL_CONTABILIDADE_GOIANIA" not in s:
              anchor = "export const EMAIL_GOIANIA = 'adm.gyn@topac.com.br' as const;\n"
              if anchor not in s: raise SystemExit('EMAIL_GOIANIA nao encontrado')
              s = s.replace(anchor, anchor + "export const EMAIL_CONTABILIDADE_GOIANIA = 'requisicao@incocontabilidade.com.br' as const;\n", 1)

          old = """export const getDestinatariosFerias = (unidade: string): readonly string[] => {\n  const normalized = String(unidade || '').normalize('NFD').replace(/[\\u0300-\\u036f]/g, '').toUpperCase();\n  return normalized.includes('GOIANIA') || normalized.includes('GOIANA')\n    ? ['requisicao@incocontabilidade.com.br']\n    : DESTINATARIOS_CONTABILIDADE;\n};\n\nexport const getDestinatariosRescisao = (unidade: string): readonly string[] => getDestinatariosFerias(unidade);\n"""
          new = """export const isGoianiaUnidade = (unidade: string) => {\n  const normalized = String(unidade || '').normalize('NFD').replace(/[\\u0300-\\u036f]/g, '').toUpperCase();\n  return normalized.includes('GOIANIA') || normalized.includes('GOIANA') || normalized.includes('GYN');\n};\n\nexport const getDestinatariosFerias = (unidade: string): readonly string[] =>\n  isGoianiaUnidade(unidade) ? [EMAIL_CONTABILIDADE_GOIANIA] : DESTINATARIOS_CONTABILIDADE;\n\nexport const getDestinatariosRescisao = (unidade: string): readonly string[] =>\n  isGoianiaUnidade(unidade) ? [EMAIL_CONTABILIDADE_GOIANIA] : DESTINATARIOS_CONTABILIDADE;\n\n/** Todo processo de RH de Goiania inclui ADM Goiania em copia. */\nexport const getCcRh = (unidade: string): readonly string[] =>\n  isGoianiaUnidade(unidade) ? [...CC_OBRIGATORIO, EMAIL_GOIANIA] : CC_OBRIGATORIO;\n\n/** Regra pronta para o futuro fechamento/apontamento delegado de Goiania. */\nexport const getDestinatariosFechamento = (unidade: string): readonly string[] =>\n  isGoianiaUnidade(unidade) ? [EMAIL_CONTABILIDADE_GOIANIA] : DESTINATARIOS_CONTABILIDADE;\n\nexport const getCcFechamento = (unidade: string): readonly string[] => getCcRh(unidade);\n"""
          if old not in s: raise SystemExit('Bloco de destinatarios legado nao encontrado')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # 3) Ferias de Goiania -> Dona Flavia; copia ADM/Robson + ADM Goiania.
          p = Path('src/pages/AvisoFeriasPage.tsx')
          s = p.read_text()
          s = s.replace("import { getDestinatariosFerias, CC_OBRIGATORIO } from '@/lib/emailUtils';", "import { getDestinatariosFerias, getCcRh } from '@/lib/emailUtils';")
          target = "    const destinatarios = Array.from(getDestinatariosFerias(company?.name || ''));\n"
          if target not in s: raise SystemExit('Destinatarios de ferias nao encontrado')
          s = s.replace(target, target + "    const copia = Array.from(getCcRh(company?.name || ''));\n", 1)
          s = s.replace("      cc: Array.from(CC_OBRIGATORIO),", "      cc: copia,", 1)
          s = s.replace("[...destinatarios, ...CC_OBRIGATORIO].join(', ')", "[...destinatarios, ...copia].join(', ')", 1)
          p.write_text(s)

          # 4) Rescisao usa empresa do funcionario para decidir destinatarios.
          p = Path('src/pages/RescisaoPage.tsx')
          s = p.read_text()
          s = s.replace("import { DESTINATARIOS_CONTABILIDADE, CC_OBRIGATORIO } from '@/lib/emailUtils';", "import { getDestinatariosRescisao, getCcRh } from '@/lib/emailUtils';")
          if "import PedidoDemissaoModelDialog" not in s:
              anchor = "import EmailPdfModal, { type EmailPdfDraft } from '@/components/EmailPdfModal';\n"
              if anchor not in s: raise SystemExit('Import EmailPdfModal nao encontrado')
              s = s.replace(anchor, anchor + "import PedidoDemissaoModelDialog from '@/components/PedidoDemissaoModelDialog';\n", 1)

          old_send = """    const nomeUsuario = await getNomeUsuarioAtual();\n    setEmailPdfDraft({\n      to: [...DESTINATARIOS_CONTABILIDADE], cc: [...CC_OBRIGATORIO],\n"""
          new_send = """    const nomeUsuario = await getNomeUsuarioAtual();\n    const unidade = row.empresa_nome || empresa?.name || '';\n    const destinatarios = Array.from(getDestinatariosRescisao(unidade));\n    const copia = Array.from(getCcRh(unidade));\n    setEmailPdfDraft({\n      to: destinatarios, cc: copia,\n"""
          if old_send not in s: raise SystemExit('Bloco de envio de rescisao nao encontrado')
          s = s.replace(old_send, new_send, 1)
          s = s.replace("[...DESTINATARIOS_CONTABILIDADE, ...CC_OBRIGATORIO].join(', ')", "[...destinatarios, ...copia].join(', ')", 1)

          # Modelo da carta passa a ser um controle normal no cabecalho de Rescisoes.
          header_anchor = """        </div>\n        <Dialog open={open} onOpenChange={(next) => { setOpen(next); if (!next) setMemoryOpen(false); }}>\n"""
          if header_anchor not in s: raise SystemExit('Cabecalho de Rescisoes nao encontrado')
          s = s.replace(header_anchor, """        </div>\n        <PedidoDemissaoModelDialog />\n        <Dialog open={open} onOpenChange={(next) => { setOpen(next); if (!next) setMemoryOpen(false); }}>\n""", 1)
          p.write_text(s)

          # 5) Trigger da carta deixa de ser fixed/floating.
          p = Path('src/components/PedidoDemissaoModelDialog.tsx')
          s = p.read_text()
          old_button = '<Button className="fixed bottom-24 right-6 z-[65] shadow-xl no-print" size="lg">'
          new_button = '<Button variant="outline" className="no-print" size="sm">'
          if old_button not in s: raise SystemExit('Botao flutuante da carta nao encontrado')
          s = s.replace(old_button, new_button, 1)
          p.write_text(s)
          PY
      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund
      - name: Validar build
        run: npm run build
      - name: Commit das correcoes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-goiania-rescisao-fluxo-v2.yml
          git add src/main.tsx src/lib/emailUtils.ts src/pages/AvisoFeriasPage.tsx src/pages/RescisaoPage.tsx src/components/PedidoDemissaoModelDialog.tsx
          git commit -m "fix: separa rescisao e RH de Goiania"
          git push origin HEAD:fix/goiania-rescisao-fluxo-1709-v2
