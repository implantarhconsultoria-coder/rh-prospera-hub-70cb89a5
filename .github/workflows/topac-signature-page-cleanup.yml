name: TOPAC Signature Digital Cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/topac-signature-page-cleanup.yml'

permissions:
  contents: write

jobs:
  rollout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply signature-only UI and eligibility rules
        run: python scripts/topac_signature_page_cleanup.py

      - name: Validate production build
        run: |
          npm install --legacy-peer-deps --package-lock=false
          npm run build

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/FolhaPagamentoPage.tsx src/components/AppSidebar.tsx src/components/payroll/PayrollPortalAdminModule.tsx src/components/payroll/BenefitSignatureGenerator.tsx api/payroll-public.ts api/payroll-archive.ts
          git commit -m "feat: simplificar assinatura digital e excluir socios"
          git push origin HEAD:main
