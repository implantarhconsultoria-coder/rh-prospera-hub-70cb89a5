name: PR70 Screenshot Investigation

on:
  push:
    branches: [test/pr70-screenshot-investigation-20260806]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect-email-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Scan screenshot and automatic fallback paths
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '=== SCREENSHOT/CANVAS/PRINT TERMS ==='
            grep -RInE --exclude-dir=node_modules --exclude-dir=dist 'html2canvas|toDataURL|screenshot|screen.?shot|capture|window\.print|print\(|getDisplayMedia|canvas|dom-to-image' src api || true
            echo
            echo '=== EMAIL MODAL / HELPER CALL SITES ==='
            grep -RInE --exclude-dir=node_modules 'EmailPdfModal|EmailPdfDraft|sendEmailWithPdfAttachment|downloadEmailWithAttachment|attachmentBlob|attachments:' src || true
            echo
            echo '=== OBJECT URL / AUTO DOWNLOAD / WINDOW OPEN ==='
            grep -RInE --exclude-dir=node_modules 'URL\.createObjectURL|window\.open|location\.href|link\.click|downloadAttachmentFallback|handleManualSend' src || true
            echo
            echo '=== BLOB CREATION NEAR EMAIL DRAFTS ==='
            grep -RInE -C 4 --exclude-dir=node_modules 'new Blob|output\(.blob|arraybuffer|pdf\.output|attachmentBlob' src || true
          } | tee pr70-investigation-report.txt
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: pr70-screenshot-investigation-${{ github.run_id }}
          path: pr70-investigation-report.txt
          retention-days: 2
