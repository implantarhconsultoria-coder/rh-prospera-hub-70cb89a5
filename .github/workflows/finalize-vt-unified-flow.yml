name: Finalize VT Unified Flow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-vt-unified-flow.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply final VT flow patches
        run: python scripts/finalize_vt_unified_flow.py
      - name: Validate production build
        run: |
          npm install --legacy-peer-deps --package-lock=false
          npm run build
      - name: Commit final VT flow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/RecibosBeneficioImpressaoPage.tsx src/components/payroll/BenefitSignatureGenerator.tsx src/lib/vtPackagePdf.ts
          git commit -m "fix(vt): fechar fluxo automatico e historico somente assinado"
          git push origin HEAD:main
