name: Patch Rescisao Estimativa

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-rescisao-estimativa.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply rescisao estimate patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          page = Path('src/pages/RescisaoPage.tsx')
          s = page.read_text(encoding='utf-8')

          s = s.replace("  const [confirmouFerias, setConfirmouFerias] = useState(false);\n", "")
          s = s.replace("    setConfirmouFerias(false);\n", "")

          s = re.sub(
              r"\n    if \(resultado\?\.revisaoFeriasNecessaria && !confirmouFerias\) \{\n      toast\.error\('Revise os períodos de férias destacados e confirme a conferência antes de finalizar\.'\);\n      setMemoryOpen\(true\);\n      return false;\n    \}",
              "",
              s,
              count=1,
          )

          s = s.replace(
              "      'Segue Memória de Cálculo da Rescisão gerada pelo TOPAC RH PRO:',\n      '',",
              "      'Segue Memória de Cálculo da Rescisão gerada pelo TOPAC RH PRO:',\n      '',\n      'IMPORTANTE: esta memória é uma estimativa interna para apoio e conferência. O cálculo rescisório oficial, valores finais e encargos serão apurados/validados pela contabilidade.',\n      '',",
              1,
          )

          s = s.replace(
              "result.revisaoFeriasNecessaria ? 'ATENÇÃO: a memória contém período(s) de férias que exigem conferência histórica.' : '',",
              "result.revisaoFeriasNecessaria ? 'OBSERVAÇÃO: há período(s) de férias com histórico incompleto/inferido. Isso não impede o envio; a validação final será feita pela contabilidade.' : '',",
              1,
          )

          s = s.replace(
              "<AlertTriangle className=\"w-3 h-3 mr-1\" />Histórico de férias exige conferência",
              "<AlertTriangle className=\"w-3 h-3 mr-1\" />Férias com dados estimados — validar com a contabilidade",
              1,
          )

          s = s.replace(
              "<b>Conferência necessária.</b> Registros legados sem período aquisitivo são inferidos e períodos sem histórico aparecem como pendentes até confirmação.",
              "<b>Aviso informativo.</b> Alguns períodos de férias foram inferidos por falta de histórico completo. A memória pode ser salva e enviada normalmente; a validação e o cálculo oficial são da contabilidade.",
              1,
          )

          s = re.sub(
              r'<label className=\\"flex items-start gap-2 border rounded p-3\\"><input type=\\"checkbox\\" checked=\{confirmouFerias\} onChange=\{\(e\) => setConfirmouFerias\(e\.target\.checked\)\} className=\\"mt-1\\" /><span><b>Conferi os períodos de férias utilizados nesta rescisão\.</b><br/><small className=\\"text-muted-foreground\\">Esta confirmação ficará refletida no snapshot/auditoria do cálculo\.</small></span></label>',
              '<div className=\\"border rounded p-3 text-sm text-muted-foreground\\"><b className=\\"text-foreground\\">Memória estimativa.</b> A conferência dos períodos pode ser feita como apoio interno, mas não bloqueia o salvamento nem o envio para a contabilidade.</div>',
              s,
              count=1,
          )

          page.write_text(s, encoding='utf-8')

          pdf = Path('src/lib/rescisaoPdf.ts')
          p = pdf.read_text(encoding='utf-8')
          p = p.replace(
              "${result.revisaoFeriasNecessaria ? '<div class=\"warn\"><b>Atenção:</b> há períodos de férias inferidos ou sem histórico completo. Conferir a memória antes de utilizar como valor definitivo.</div>' : ''}",
              "<div class=\"warn\"><b>PRÉVIA ESTIMATIVA:</b> esta memória é apenas referência interna. O cálculo rescisório oficial, valores finais, encargos e validações são de responsabilidade da contabilidade.</div>\n    ${result.revisaoFeriasNecessaria ? '<div class=\"warn\"><b>Observação:</b> há períodos de férias inferidos ou sem histórico completo. Esta condição não impede o envio para conferência contábil.</div>' : ''}",
              1,
          )
          p = p.replace(
              "<p class=\"small\">Cálculo estimativo gerado pelo TOPAC RH PRO. Conferir convenção coletiva, eventos de folha e particularidades do vínculo antes da quitação.</p>",
              "<p class=\"small\"><b>PRÉVIA ESTIMATIVA.</b> Documento de apoio gerado pelo TOPAC RH PRO. O cálculo rescisório oficial, valores finais, encargos, convenção coletiva e particularidades do vínculo devem ser apurados e validados pela contabilidade antes da quitação.</p>",
              1,
          )
          marker = "  y += 7;\n\n  line('Funcionario', data.funcionario);"
          replacement = "  y += 7;\n  doc.setFont('helvetica', 'bold');\n  doc.setFontSize(7.5);\n  const estimateNotice = doc.splitTextToSize('PREVIA ESTIMATIVA - memoria de apoio interno. O calculo rescisorio oficial, valores finais e encargos devem ser apurados e validados pela contabilidade.', width);\n  doc.text(estimateNotice, margin, y);\n  y += estimateNotice.length * 4 + 4;\n\n  line('Funcionario', data.funcionario);"
          if marker not in p:
              raise SystemExit('jsPDF estimate marker not found')
          p = p.replace(marker, replacement, 1)
          pdf.write_text(p, encoding='utf-8')
          PY
      - name: Validate production build
        run: |
          npm install --legacy-peer-deps --package-lock=false
          npm run build
      - name: Commit rescisao estimate flow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/RescisaoPage.tsx src/lib/rescisaoPdf.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix(rescisao): liberar envio como memoria estimativa"
          git push origin HEAD:main
