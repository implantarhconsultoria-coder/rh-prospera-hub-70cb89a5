name: Apply Supabase session fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-apply-session-fix.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: disparar correção temporária de sessão Supabase'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-supabase-session-frota-protocolo-20260811
          fetch-depth: 0
      - name: Patch target branch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          p = Path('api/frota-upload.ts')
          s = p.read_text()
          old = """const getSupabase = (accessToken: string) => {\n  const url = env('SUPABASE_URL') || env('VITE_SUPABASE_URL') || FALLBACK_SUPABASE_URL;\n  const key = env('SUPABASE_PUBLISHABLE_KEY') || env('VITE_SUPABASE_PUBLISHABLE_KEY') || env('VITE_SUPABASE_ANON_KEY') || FALLBACK_SUPABASE_PUBLISHABLE_KEY;\n  return createClient(url, key, {\n"""
          new = """const getSupabase = (accessToken: string) => {\n  // Deve validar o JWT no mesmo projeto Supabase usado pelo navegador.\n  const url = env('VITE_SUPABASE_URL') || env('VITE_SUPABASE_UR') || env('SUPABASE_URL') || FALLBACK_SUPABASE_URL;\n  const key = env('VITE_SUPABASE_PUBLISHABLE_KEY') || env('VITE_SUPABASE_ANON_KEY') || env('SUPABASE_PUBLISHABLE_KEY') || FALLBACK_SUPABASE_PUBLISHABLE_KEY;\n  return createClient(url, key, {\n"""
          assert old in s, 'getSupabase block not found'
          p.write_text(s.replace(old, new, 1))

          helper = Path('src/lib/freshSupabaseSession.ts')
          helper.write_text("""import type { Session } from '@supabase/supabase-js';\nimport { supabase } from '@/integrations/supabase/client';\n\nconst EXPIRY_SAFETY_SECONDS = 60;\n\nexport const getFreshSupabaseSession = async (): Promise<Session> => {\n  const current = await supabase.auth.getSession();\n  if (current.error) {\n    throw new Error(`Não foi possível validar a sessão: ${current.error.message}`);\n  }\n\n  let session = current.data.session;\n  const expiresAt = Number(session?.expires_at || 0);\n  const shouldRefresh = !session?.access_token || !session?.user?.id || expiresAt <= Math.floor(Date.now() / 1000) + EXPIRY_SAFETY_SECONDS;\n\n  if (shouldRefresh) {\n    const refreshed = await supabase.auth.refreshSession();\n    if (refreshed.error) {\n      throw new Error(`Sessão expirada. Faça login novamente. (${refreshed.error.message})`);\n    }\n    session = refreshed.data.session;\n  }\n\n  if (!session?.access_token || !session?.user?.id) {\n    throw new Error('Sessão expirada. Faça login novamente.');\n  }\n\n  return session;\n};\n""")

          p = Path('src/pages/DocumentosVeiculosPage.tsx')
          s = p.read_text()
          anchor = "import { supabase } from '@/integrations/supabase/client';\n"
          assert anchor in s
          s = s.replace(anchor, anchor + "import { getFreshSupabaseSession } from '@/lib/freshSupabaseSession';\n", 1)
          old = """const upsertDirectCloudAsset = async (file: File, extracted: any) => {\n  if (!session?.user?.id) throw new Error('Sessão expirada.');\n  const ext = file.name.split('.').pop() || 'pdf';\n  const path = `${session.user.id}/frota/${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;\n"""
          new = """const upsertDirectCloudAsset = async (file: File, extracted: any, authenticatedUserId: string) => {\n  if (!authenticatedUserId) throw new Error('Sessão expirada.');\n  const ext = file.name.split('.').pop() || 'pdf';\n  const path = `${authenticatedUserId}/frota/${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;\n"""
          assert old in s
          s = s.replace(old, new, 1)
          s = s.replace('user_id: session.user.id,', 'user_id: authenticatedUserId,', 1)
          old = """const handleMultiUpload = async (files: FileList) => {\n  if (!session?.user?.id || !session?.access_token) { toast.error('Faca login primeiro'); return; }\n  const pdfs = Array.from(files).filter((file) => file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf'));\n  if (!pdfs.length) { toast.error('Selecione arquivos PDF.'); return; }\n\n  setUploading(true);\n"""
          new = """const handleMultiUpload = async (files: FileList) => {\n  const pdfs = Array.from(files).filter((file) => file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf'));\n  if (!pdfs.length) { toast.error('Selecione arquivos PDF.'); return; }\n\n  let activeSession;\n  try {\n    activeSession = await getFreshSupabaseSession();\n  } catch (error: any) {\n    toast.error(error?.message || 'Sessão expirada. Faça login novamente.');\n    return;\n  }\n\n  setUploading(true);\n"""
          assert old in s
          s = s.replace(old, new, 1)
          s = s.replace("headers: { Authorization: `Bearer ${session.access_token}` },", "headers: { Authorization: `Bearer ${activeSession.access_token}` },", 1)
          s = s.replace('await upsertDirectCloudAsset(file, extracted);', 'await upsertDirectCloudAsset(file, extracted, activeSession.user.id);', 1)
          p.write_text(s)

          p = Path('src/pages/ProtocoloPage.tsx')
          s = p.read_text()
          anchor = "import { supabase } from '@/integrations/supabase/client';\n"
          assert anchor in s
          s = s.replace(anchor, anchor + "import { getFreshSupabaseSession } from '@/lib/freshSupabaseSession';\n", 1)
          old = """    if (!session?.access_token) {\n      toast.error('Sessão expirada. Entre novamente.');\n      return;\n    }\n\n    setParsing(true);\n    try {\n      // Atualiza a Frota antes de cruzar placa/patrimônio, evitando resultado com cache antigo.\n      const freshAssets = await loadAssets();\n"""
          new = """    setParsing(true);\n    try {\n      const activeSession = await getFreshSupabaseSession();\n      // Atualiza a Frota antes de cruzar placa/patrimônio, evitando resultado com cache antigo.\n      const freshAssets = await loadAssets();\n"""
          assert old in s
          s = s.replace(old, new, 1)
          s = s.replace('Authorization: `Bearer ${session.access_token}`,', 'Authorization: `Bearer ${activeSession.access_token}`,', 1)
          p.write_text(s)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/frota-upload.ts src/lib/freshSupabaseSession.ts src/pages/DocumentosVeiculosPage.tsx src/pages/ProtocoloPage.tsx
          git commit -m "fix: renovar JWT e alinhar Supabase no upload da Frota"
          git push origin HEAD:agent/fix-supabase-session-frota-protocolo-20260811
