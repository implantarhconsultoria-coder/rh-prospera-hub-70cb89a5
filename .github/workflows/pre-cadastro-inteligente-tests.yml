name: Pre-cadastro inteligente tests

on:
  push:
    branches:
      - feat/pre-cadastro-inteligente-20260903
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Mandatory parser tests
        run: npx vitest run src/lib/preCadastroInteligente.test.ts
      - name: Production build
        run: npm run build
