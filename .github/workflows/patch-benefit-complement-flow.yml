name: Patch Benefit Complement Flow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-benefit-complement-flow.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply benefit complement patches
        run: python scripts/patch_benefit_complement_flow.py
      - name: Validate production build
        run: |
          npm install --legacy-peer-deps --package-lock=false
          npm run build
      - name: Commit benefit complement flow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/BenefitValuePaymentEditor.tsx src/pages/EmployeeDetailPage.tsx src/pages/RelatorioVTPage.tsx api/payroll-public.ts api/payroll-archive.ts
          git commit -m "feat(benefits): preservar pagamento original e gerar complemento"
          git push origin HEAD:main
