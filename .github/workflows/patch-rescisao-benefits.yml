name: Patch Rescisao Benefits

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-rescisao-benefits.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply rescisao benefit patch
        run: python scripts/patch_rescisao_benefits.py
      - name: Validate production build
        run: |
          npm install --legacy-peer-deps --package-lock=false
          npm run build
      - name: Commit rescisao benefit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/RescisaoPage.tsx
          git commit -m "fix(rescisao): puxar VR e VT fechados automaticamente"
          git push origin HEAD:main
