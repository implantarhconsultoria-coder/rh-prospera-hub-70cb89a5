name: TOPAC Audit PDF Rescisao

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Vacation source map
        shell: bash
        run: |
          echo '=== FERIAS_AVISOS EXACT REFERENCES ==='
          grep -RIn --exclude-dir=node_modules --exclude-dir=dist --exclude='*.map' 'ferias_avisos' src api supabase 2>/dev/null || true
          echo '=== VACATION PERIOD FIELDS ==='
          grep -RInE --exclude-dir=node_modules --exclude-dir=dist --exclude='*.map' 'periodo_aquisitivo_inicio|periodo_aquisitivo_fim|periodo_gozo_inicio|periodo_gozo_fim|dias_ferias|status_pagamento|opcao_adiantamento_13' src api supabase 2>/dev/null || true
          echo '=== RESCISAO REFERENCES ==='
          grep -RInE --exclude-dir=node_modules --exclude-dir=dist --exclude='*.map' 'rescisao|Rescisao|rescisão|Rescisão|feriasVencidasMeses|avisoPrevioTipo|fgtsSaldo' src api supabase 2>/dev/null || true
          echo '=== ROUTES ==='
          grep -RInE --exclude-dir=node_modules --exclude-dir=dist --exclude='*.map' 'RescisaoPage|FeriasPage|/rescis|/ferias' src 2>/dev/null || true
