name: Adicionar funcoes no pre-cadastro

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  aplicar:
    if: github.event.issue.title == '[TOPAC] adicionar vendedor e representante no pre-cadastro'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Adicionar Vendedor e Representante
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/pages/PreCadastroAdmissionalOcrPage.tsx')
          text = path.read_text(encoding='utf-8')

          marker = """  {
    cargo: 'AJUDANTE DE MECANICO',
    salarioBase: 2100,
    insalubridadeAtiva: true,
    insalubridadeValor: 648.40,
    periculosidadeAtiva: false,
    periculosidadeValor: 0,
  },
"""
          addition = marker + """  {
    cargo: 'VENDEDOR',
    salarioBase: 0,
    insalubridadeAtiva: false,
    insalubridadeValor: 0,
    periculosidadeAtiva: false,
    periculosidadeValor: 0,
  },
  {
    cargo: 'REPRESENTANTE',
    salarioBase: 0,
    insalubridadeAtiva: false,
    insalubridadeValor: 0,
    periculosidadeAtiva: false,
    periculosidadeValor: 0,
  },
"""

          if "cargo: 'VENDEDOR'" not in text:
              if marker not in text:
                  raise SystemExit('Bloco de funcoes fixas nao encontrado')
              text = text.replace(marker, addition, 1)

          old = "{role.cargo} - {formatBRL(role.salarioBase || 0)}{role.insalubridadeAtiva ? ' - insalubridade' : role.periculosidadeAtiva ? ' - periculosidade' : ''}"
          new = "{role.cargo}{role.salarioBase > 0 ? ` - ${formatBRL(role.salarioBase)}` : ''}{role.insalubridadeAtiva ? ' - insalubridade' : role.periculosidadeAtiva ? ' - periculosidade' : ''}"
          if old in text:
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
      - name: Commit da alteracao
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/PreCadastroAdmissionalOcrPage.tsx
          if git diff --cached --quiet; then
            echo "Nada para alterar"
          else
            git commit -m "feat: adicionar Vendedor e Representante no pre-cadastro"
            git push origin main
          fi
      - name: Encerrar issue de disparo
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            })
