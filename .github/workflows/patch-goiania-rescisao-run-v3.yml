name: Patch Goiania Rescisao Run V3

on:
  push:
    branches:
      - fix/goiania-rescisao-fluxo-1709-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/goiania-rescisao-fluxo-1709-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Executar patch existente
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/patch-goiania-rescisao-fluxo-v2.yml').read_text().splitlines()
          inside = False
          out = []
          for line in text:
              if "python - <<'PY'" in line:
                  inside = True
                  continue
              if inside and line.strip() == 'PY':
                  break
              if inside:
                  out.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/patch_goiania.py').write_text('\n'.join(out) + '\n')
          PY
          python /tmp/patch_goiania.py
      - name: Instalar dependencias
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Validar build
        run: npm run build
      - name: Commit das correcoes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-goiania-rescisao-fluxo-v2.yml .github/workflows/patch-goiania-rescisao-run-v3.yml
          git add src/main.tsx src/lib/emailUtils.ts src/pages/AvisoFeriasPage.tsx src/pages/RescisaoPage.tsx src/components/PedidoDemissaoModelDialog.tsx package-lock.json
          git commit -m "fix: separa rescisao e RH de Goiania"
          git push origin HEAD:fix/goiania-rescisao-fluxo-1709-v2
