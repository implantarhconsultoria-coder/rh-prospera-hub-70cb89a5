name: TOPAC Finalize KM Report

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/km-page/**"
      - ".github/workflows/topac-export-km-source.yml"

permissions:
  contents: write

jobs:
  finalize-km-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/topac-relatorio-km-corporativo-20260806
          fetch-depth: 0

      - name: Decode final interface and clean temporary preparation
        run: |
          cat .github/km-page/chunk_* | base64 -d > src/pages/admin/CombustivelQRAdminPage.tsx

          rm -rf .github/km-page
          rm -rf .github/km-patch
          rm -f .github/workflows/topac-apply-km-patch.yml
          rm -f .github/workflows/topac-export-km-source.yml
          rm -f .github/pull_request_template_km.md

          git config user.name "TOPAC Engineering"
          git config user.email "engineering@topac.local"
          git add -A
          git commit -m "fix: finalizar interface corporativa do relatório de KM"
          git push origin HEAD:fix/topac-relatorio-km-corporativo-20260806
