name: TOPAC Apply PDF Phase 1

on:
  push:
    branches: [agent/topac-pdf-rescisao-20260807]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/topac-pdf-rescisao-20260807
          fetch-depth: 0
      - name: Apply report parity patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'pattern not found in {path}: {old[:120]!r}')
              s = s.replace(old, new, count)
              p.write_text(s, encoding='utf-8')

          for path, benefit, label in [
              ('src/pages/RelatorioVRImpressaoPage.tsx', 'ValeRefeicao', 'vale refeicao'),
              ('src/pages/RelatorioVTImpressaoPage.tsx', 'ValeTransporte', 'vale transporte'),
          ]:
              replace(
                  path,
                  "import { buildPdfFileName, competenciaPdfPart, saveElementAsPdf } from '@/lib/savePdf';\nimport { toast } from 'sonner';",
                  "import { buildTopacRhPdfFileName, printDocumentAsPdf } from '@/lib/savePdf';",
              )
              print_id = 'vr' if benefit == 'ValeRefeicao' else 'vt'
              old = f"""  const handleSalvarPdf = async () => {{\n    try {{\n      const empresaArquivo = blocks.length === 1 ? blocks[0].company.name : `${{blocks.length}}_empresas`;\n      await saveElementAsPdf({{\n        element: document.getElementById('{print_id}-print-area'),\n        fileName: buildPdfFileName('relatorio {label}', empresaArquivo, competenciaPdfPart(competencia)),\n      }});\n      toast.success('PDF salvo com sucesso.');\n    }} catch (error: any) {{\n      toast.error(error?.message || 'Nao foi possivel salvar o PDF.');\n    }}\n  }};"""
              new = f"""  const pdfFileName = buildTopacRhPdfFileName({{\n    tipo: 'Relatorio{benefit}',\n    nome: blocks.length === 1 ? blocks[0].company.name : 'Multiempresas',\n    competencia,\n  }});\n  const handlePrintOrPdf = () => printDocumentAsPdf(pdfFileName);"""
              replace(path, old, new)
              replace(path, 'onClick={() => window.print()}', 'onClick={handlePrintOrPdf}')
              replace(path, 'onClick={handleSalvarPdf}', 'onClick={handlePrintOrPdf}')
              replace(
                  path,
                  '<table className="w-full border-collapse" style={{ fontSize: \'10px\' }}>',
                  '<table className="w-full border-collapse" style={{ fontSize: \'10px\', tableLayout: \'fixed\' }}>',
                  count=1,
              )

          path = 'src/pages/RecibosBeneficioImpressaoPage.tsx'
          replace(
              path,
              "import { buildPdfFileName, competenciaPdfPart, downloadPdfBlob } from '@/lib/savePdf';",
              "import { buildTopacRhPdfFileName, printDocumentAsPdf } from '@/lib/savePdf';",
          )
          replace(
              path,
              """  const getRecibosPdfFileName = (items: ReciboItem[]) => {\n    const empresas = Array.from(new Set(items.map((item) => item.company?.name || '').filter(Boolean)));\n    const funcionarios = Array.from(new Set(items.map((item) => item.emp?.name || '').filter(Boolean)));\n    const empresaArquivo = empresas.length === 1 ? empresas[0] : `${empresas.length || empresaIds.length}_empresas`;\n    const funcionarioArquivo = funcionarios.length === 1 ? funcionarios[0] : `${funcionarios.length || items.length}_funcionarios`;\n    return buildPdfFileName('recibos', formatoLabel, empresaArquivo, funcionarioArquivo, competenciaPdfPart(competencia));\n  };""",
              """  const getRecibosPdfFileName = (items: ReciboItem[]) => {\n    const empresas = Array.from(new Set(items.map((item) => item.company?.name || '').filter(Boolean)));\n    const funcionarios = Array.from(new Set(items.map((item) => item.emp?.name || '').filter(Boolean)));\n    if (funcionarios.length === 1) {\n      return buildTopacRhPdfFileName({ tipo: 'Funcionario', nome: funcionarios[0], competencia });\n    }\n    return buildTopacRhPdfFileName({\n      tipo: `Recibos${formatoLabel.replace(/[^A-Za-z0-9]+/g, '')}`,\n      nome: empresas.length === 1 ? empresas[0] : 'Multiempresas',\n      competencia,\n    });\n  };""",
          )
          replace(
              path,
              """  const handleImprimirPdf = async () => {\n    await arquivarRecibosNoHistorico(recibos, 'impressao').catch((error) => {\n      console.error('Erro ao arquivar recibos no historico:', error);\n      toast.warning('PDF aberto, mas alguns recibos nao foram salvos no historico.');\n    });\n    window.print();\n  };""",
              """  const handleImprimirPdf = async () => {\n    await arquivarRecibosNoHistorico(recibos, 'impressao').catch((error) => {\n      console.error('Erro ao arquivar recibos no historico:', error);\n      toast.warning('Impressão aberta, mas alguns recibos não foram salvos no histórico.');\n    });\n    printDocumentAsPdf(getRecibosPdfFileName(recibos));\n  };""",
          )
          replace(
              path,
              """  const handleSalvarPdf = async () => {\n    setSavingPdf(true);\n    try {\n      const pdfBlob = gerarPdfRecibosBlob(recibos);\n      const fileName = getRecibosPdfFileName(recibos);\n      downloadPdfBlob(pdfBlob, fileName);\n      await arquivarRecibosNoHistorico(recibos, 'download').catch((error) => {\n        console.error('Erro ao arquivar recibos no historico:', error);\n        toast.warning('PDF salvo, mas alguns recibos nao foram salvos no historico.');\n      });\n      toast.success('PDF salvo com sucesso.');\n    } catch (error: any) {\n      toast.error(error?.message || 'Nao foi possivel salvar o PDF.');\n    } finally {\n      setSavingPdf(false);\n    }\n  };""",
              """  const handleSalvarPdf = async () => {\n    setSavingPdf(true);\n    try {\n      await arquivarRecibosNoHistorico(recibos, 'download').catch((error) => {\n        console.error('Erro ao arquivar recibos no historico:', error);\n        toast.warning('PDF pronto, mas alguns recibos não foram salvos no histórico.');\n      });\n      printDocumentAsPdf(getRecibosPdfFileName(recibos));\n    } catch (error: any) {\n      toast.error(error?.message || 'Não foi possível preparar o PDF.');\n    } finally {\n      setSavingPdf(false);\n    }\n  };""",
          )
          PY
      - name: Validate changed scope
        run: |
          npm ci
          npx vitest run src/lib/__tests__/pdfStandardization.test.ts
          npx eslint src/lib/savePdf.ts src/pages/RelatorioImpressaoPage.tsx src/pages/RelatorioBeneficioIndividualPage.tsx src/pages/RelatorioVRImpressaoPage.tsx src/pages/RelatorioVTImpressaoPage.tsx src/pages/RecibosBeneficioImpressaoPage.tsx src/lib/__tests__/pdfStandardization.test.ts --rule '@typescript-eslint/no-explicit-any: off' --rule 'react-hooks/exhaustive-deps: off'
          npm run build
      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/RelatorioVRImpressaoPage.tsx src/pages/RelatorioVTImpressaoPage.tsx src/pages/RecibosBeneficioImpressaoPage.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: padronizar impressão e nomes dos relatórios"
          git push origin HEAD:agent/topac-pdf-rescisao-20260807
