name: Corrigir arquivo grande no envio de e-mail

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-email-large-single-file.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Remover limite artificial por arquivo
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/lib/emailUtils.ts';
          let text = fs.readFileSync(path, 'utf8');
          if (!text.includes('const MAX_PAYLOAD_BASE64_CHARS = 2_900_000;')) {
            throw new Error('Limite esperado não encontrado');
          }
          text = text.replace('const MAX_PAYLOAD_BASE64_CHARS = 2_900_000;', 'const MAX_PAYLOAD_BASE64_CHARS = 4_000_000;');
          fs.writeFileSync(path, text);
          fs.rmSync('.github/workflows/fix-email-large-single-file.yml');
          NODE
      - name: Validar build
        run: |
          npm ci
          npm run build
      - name: Commitar somente a correção
        run: |
          git config user.name "TOPAC Automation"
          git config user.email "actions@github.com"
          git add src/lib/emailUtils.ts .github/workflows/fix-email-large-single-file.yml
          git commit -m "fix: permitir arquivo grande em lote individual no e-mail"
          git push origin main
