name: TOPAC Payroll Vacation Rollout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/topac-payroll-vacation-rollout.yml'

permissions:
  contents: write

jobs:
  rollout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply payroll and vacation integration
        run: python scripts/topac_payroll_vacation_rollout.py

      - name: Validate build
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Commit rollout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/payroll-public.ts api/payroll-archive.ts src/components/payroll/PayrollPortalAdminModule.tsx src/pages/AvisoFeriasPage.tsx
          git commit -m "feat: integrar assinatura multidocumento e programação de férias"
          git push origin HEAD:main
