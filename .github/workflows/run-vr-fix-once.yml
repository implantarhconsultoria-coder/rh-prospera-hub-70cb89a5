name: Executar correcao VR uma vez

on:
  push:
    branches: [main]
    paths: [.github/workflows/run-vr-fix-once.yml]

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vr-parametros-sincronizados
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Aplicar correções
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def rep(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: esperado 1, encontrado {n}')
              return text.replace(old, new, 1)

          p = Path('src/pages/RelatorioVRPage.tsx')
          t = p.read_text(encoding='utf-8')
          t = rep(t, "  const [competenciaEmpresa, setCompetenciaEmpresa] = useState(new Date().toISOString().slice(0, 7));\n  const [diasUteisManual, setDiasUteisManual] = useState('');\n  const [diasUteisEmpresaManual, setDiasUteisEmpresaManual] = useState('');\n  const [dataPagamentoManual, setDataPagamentoManual] = useState('');\n  const [dataPagamentoEmpresaManual, setDataPagamentoEmpresaManual] = useState('');\n", "  const [diasUteisManual, setDiasUteisManual] = useState('');\n  const [dataPagamentoManual, setDataPagamentoManual] = useState('');\n", 'estados duplicados')
          t = rep(t, "  const diasUteis = Number(diasUteisManual) > 0 ? Number(diasUteisManual) : diasUteisCalculado;\n  const diasUteisEmpresa = Number(diasUteisEmpresaManual) > 0 ? Number(diasUteisEmpresaManual) : undefined;\n", "  const diasUteis = Number(diasUteisManual) > 0 ? Number(diasUteisManual) : diasUteisCalculado;\n", 'dias duplicados')
          t = rep(t, "  const pagamentoDate = getFirstBusinessDayOfNextMonth(competencia);", "  const pagamentoDate = dataPagamentoManual || getFirstBusinessDayOfNextMonth(competencia);", 'pagamento exibido')
          t = rep(t, "    if (Number(diasUteisManual) > 0) params.set('diasUteis', String(Number(diasUteisManual)));\n    navigate(`/relatorio-vr-impressao?${params.toString()}`);", "    if (Number(diasUteisManual) > 0) params.set('diasUteis', String(Number(diasUteisManual)));\n    if (dataPagamentoManual) params.set('dataPagamento', dataPagamentoManual);\n    navigate(`/relatorio-vr-impressao?${params.toString()}`);", 'data no relatorio')
          old = """  const handleRecibosTodasEmpresas = () => {
    if (!competenciaEmpresa) { toast.error('Selecione a competência'); return; }
    companies.forEach(c => getOrCreateEntries(c.id, competenciaEmpresa));
    const params = new URLSearchParams({ formato, competencia: competenciaEmpresa, empresas: companies.map(c => c.id).join(',') });
    if (diasUteisEmpresa) params.set('diasUteis', String(diasUteisEmpresa));
    if (dataPagamentoEmpresaManual) params.set('dataPagamento', dataPagamentoEmpresaManual);
    window.open(`/recibos-beneficio?${params.toString()}`, '_blank');
  };
  const handleRecibosEmpresasSelecionadas = () => {
    if (multiCompanies.size === 0) { toast.error('Selecione ao menos uma empresa'); return; }
    if (!competenciaEmpresa) { toast.error('Selecione a competência'); return; }
    Array.from(multiCompanies).forEach(cid => getOrCreateEntries(cid, competenciaEmpresa));
    const params = new URLSearchParams({ formato, competencia: competenciaEmpresa, empresas: Array.from(multiCompanies).join(',') });
    if (diasUteisEmpresa) params.set('diasUteis', String(diasUteisEmpresa));
    if (dataPagamentoEmpresaManual) params.set('dataPagamento', dataPagamentoEmpresaManual);
    window.open(`/recibos-beneficio?${params.toString()}`, '_blank');
  };
"""
          new = """  const handleRecibosTodasEmpresas = () => {
    if (!competencia) { toast.error('Selecione a competência'); return; }
    companies.forEach(c => getOrCreateEntries(c.id, competencia));
    goRecibos(companies.map(c => c.id));
  };
  const handleRecibosEmpresasSelecionadas = () => {
    if (multiCompanies.size === 0) { toast.error('Selecione ao menos uma empresa'); return; }
    if (!competencia) { toast.error('Selecione a competência'); return; }
    Array.from(multiCompanies).forEach(cid => getOrCreateEntries(cid, competencia));
    goRecibos(Array.from(multiCompanies));
  };
"""
          t = rep(t, old, new, 'recibos em massa')
          t = rep(t, '<Input type="month" value={competenciaEmpresa} onChange={e => setCompetenciaEmpresa(e.target.value)} className="w-44" />', '<Input type="month" value={competencia} onChange={e => { setCompetencia(e.target.value); setGenerated(false); }} className="w-44" />', 'competencia seção')
          t = rep(t, '<Input type="number" min="1" step="1" value={diasUteisEmpresaManual}\n              onChange={e => setDiasUteisEmpresaManual(e.target.value)}\n              placeholder="auto" className="w-28" />', '<Input type="number" min="1" step="1" value={diasUteisManual}\n              onChange={e => { setDiasUteisManual(e.target.value); setGenerated(false); }}\n              placeholder={String(diasUteisCalculado)} className="w-28" />', 'dias seção')
          t = rep(t, '<Input type="date" value={dataPagamentoEmpresaManual} onChange={e => setDataPagamentoEmpresaManual(e.target.value)} className="w-40" />', '<Input type="date" value={dataPagamentoManual} onChange={e => setDataPagamentoManual(e.target.value)} className="w-40" />', 'pagamento seção')
          t = rep(t, '<RecibosPreviewModal open={previewOpen} onOpenChange={setPreviewOpen} tipo="vr" company={company} competencia={competencia} rows={previewRows} onPrint={handleRecibosSelecionados} />', '<RecibosPreviewModal open={previewOpen} onOpenChange={setPreviewOpen} tipo="vr" company={company} competencia={competencia} diasUteis={diasUteis} dataPagamento={pagamentoDate} rows={previewRows} onPrint={handleRecibosSelecionados} />', 'prévia')
          p.write_text(t, encoding='utf-8')

          p = Path('src/components/RecibosPreviewModal.tsx')
          t = p.read_text(encoding='utf-8')
          t = rep(t, '  competencia: string;\n  rows: BenefitReportRow[];', '  competencia: string;\n  diasUteis?: number;\n  dataPagamento?: string;\n  rows: BenefitReportRow[];', 'props prévia')
          t = rep(t, "const RecibosPreviewModal: React.FC<Props> = ({ open, onOpenChange, tipo, company, competencia, rows, onPrint }) => {\n  const competenciaLabel = competencia ? competenciaPt(competencia) : '';\n  const dataPagamento = competencia ? getFirstBusinessDayOfNextMonth(competencia) : '';", "const RecibosPreviewModal: React.FC<Props> = ({ open, onOpenChange, tipo, company, competencia, diasUteis, dataPagamento: dataPagamentoProp, rows, onPrint }) => {\n  const competenciaLabel = competencia ? competenciaPt(competencia) : '';\n  const dataPagamento = dataPagamentoProp || (competencia ? getFirstBusinessDayOfNextMonth(competencia) : '');", 'pagamento prévia')
          t = rep(t, '<tr><td className="py-1 pr-4 font-semibold">Competência:</td><td className="py-1">{competenciaLabel}</td></tr>', '<tr><td className="py-1 pr-4 font-semibold">Competência:</td><td className="py-1">{competenciaLabel}</td></tr>\n                        {diasUteis ? <tr><td className="py-1 pr-4 font-semibold">Dias úteis:</td><td className="py-1">{diasUteis}</td></tr> : null}', 'dias prévia')
          p.write_text(t, encoding='utf-8')

          p = Path('src/pages/RelatorioVRImpressaoPage.tsx')
          t = p.read_text(encoding='utf-8')
          t = rep(t, 'const EmpresaPagina: React.FC<{ block: EmpresaBlock; competencia: string; consolidado: boolean }> = ({ block, competencia, consolidado }) => (', 'const EmpresaPagina: React.FC<{ block: EmpresaBlock; competencia: string; consolidado: boolean; dataPagamento?: string }> = ({ block, competencia, consolidado, dataPagamento }) => (', 'prop impressão')
          t = rep(t, '<p className="text-xs">Dias úteis: {block.diasUteis}</p>', '<p className="text-xs">Dias úteis: {block.diasUteis}</p>\n          {dataPagamento && <p className="text-xs">Pagamento: {dataPagamento}</p>}', 'pagamento impressão')
          t = rep(t, "  const diasUteisManual = Number(searchParams.get('diasUteis') || 0);", "  const diasUteisManual = Number(searchParams.get('diasUteis') || 0);\n  const dataPagamentoParam = searchParams.get('dataPagamento') || '';\n  const dataPagamento = dataPagamentoParam ? dataPagamentoParam.split('-').reverse().join('/') : '';", 'ler pagamento')
          t = rep(t, '<EmpresaPagina key={b.company.id} block={b} competencia={competencia} consolidado={consolidado} />', '<EmpresaPagina key={b.company.id} block={b} competencia={competencia} consolidado={consolidado} dataPagamento={dataPagamento} />', 'passar pagamento')
          p.write_text(t, encoding='utf-8')
          PY
      - run: npm ci
      - run: npm run build
      - name: Commit e push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/RelatorioVRPage.tsx src/components/RecibosPreviewModal.tsx src/pages/RelatorioVRImpressaoPage.tsx
          git commit -m "fix: sincronizar parametros de VR em relatorios e recibos"
          git push origin HEAD:fix/vr-parametros-sincronizados
