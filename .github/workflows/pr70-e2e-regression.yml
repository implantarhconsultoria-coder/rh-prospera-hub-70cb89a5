name: PR70 E2E Regression Final

on:
  push:
    branches: [test/pr70-e2e-regression-20260806]

permissions:
  contents: read

jobs:
  attachment-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://djfjnxmbvjgweqzjvqtr.supabase.co
      SUPABASE_KEY: sb_publishable_DHu9U7RSOV8uPwW2XXtH8A_ek7QfU_Z
      STORAGE_BUCKET: email-anexos-temporarios
      PREVIEW_ORIGIN: https://rh-prospera-hub-70cb89a5-he48y616e.vercel.app
      PREVIEW_SHARE_URL: https://rh-prospera-hub-70cb89a5-he48y616e.vercel.app/?_vercel_share=T0e5pHF7ketLXFELIsw0C98gldorQjtQ
      RECIPIENT: implantarh.consultoria@gmail.com
    steps:
      - name: Checkout exact corrected PR head
        uses: actions/checkout@v4

      - name: Verify no automatic screenshot or fallback path
        run: |
          set -euo pipefail
          ! grep -q 'handleManualSend(false)' src/components/EmailPdfModal.tsx
          ! grep -q 'openPdfPreview(attachmentBlob)' src/lib/emailUtils.ts
          ! grep -q "new Blob(\[originalBlob\], { type: 'application/pdf' })" src/components/HistoricoDocumentalFuncionario.tsx
          grep -q 'Nenhuma janela ou download foi aberto automaticamente' src/components/EmailPdfModal.tsx

      - name: Create authenticated technical user
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          TEST_EMAIL="implantarh.consultoria+topac-pr70-regression-${GITHUB_RUN_ID}@gmail.com"
          TEST_PASSWORD="$(openssl rand -hex 24)Aa1!"
          echo "::add-mask::$TEST_PASSWORD"
          SIGNUP_BODY=$(jq -n --arg email "$TEST_EMAIL" --arg password "$TEST_PASSWORD" '{email:$email,password:$password,data:{nome_completo:"Teste PR70 Regressão",origem:"pr70-regression-final"}}')
          curl -sS -o signup.json -X POST "$SUPABASE_URL/auth/v1/signup" -H "apikey: $SUPABASE_KEY" -H 'content-type: application/json' --data "$SIGNUP_BODY"
          USER_ID=$(jq -r '.user.id // .id // empty' signup.json)
          test -n "$USER_ID" || { cat signup.json; exit 1; }
          TOKEN_BODY=$(jq -n --arg email "$TEST_EMAIL" --arg password "$TEST_PASSWORD" '{email:$email,password:$password}')
          ACCESS_TOKEN=$(jq -r '.access_token // empty' signup.json)
          for attempt in $(seq 1 120); do
            [ -n "$ACCESS_TOKEN" ] && break
            sleep 3
            curl -sS -o token.json -X POST "$SUPABASE_URL/auth/v1/token?grant_type=password" -H "apikey: $SUPABASE_KEY" -H 'content-type: application/json' --data "$TOKEN_BODY"
            ACCESS_TOKEN=$(jq -r '.access_token // empty' token.json)
          done
          test -n "$ACCESS_TOKEN" || exit 2
          echo "::add-mask::$ACCESS_TOKEN"
          printf '%s' "$ACCESS_TOKEN" > access_token.txt
          echo "test_email=$TEST_EMAIL" >> "$GITHUB_OUTPUT"
          echo "user_id=$USER_ID" >> "$GITHUB_OUTPUT"

      - name: Generate selected real PNG above 4.5 MiB
        id: file
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,struct,zlib
          from pathlib import Path
          w,h=1600,1200
          pixels=hashlib.shake_256(b'TOPAC-PR70-ARQUIVO-SELECIONADO-REAL').digest(w*h*3)
          raw=bytearray(); stride=w*3
          for y in range(h): raw.append(0); raw.extend(pixels[y*stride:(y+1)*stride])
          def chunk(t,d): return struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff)
          png=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',w,h,8,2,0,0,0))+chunk(b'IDAT',zlib.compress(bytes(raw),0))+chunk(b'IEND',b'')
          path=Path('atestado-selecionado-real.png'); path.write_bytes(png)
          meta={'filename':path.name,'size_bytes':len(png),'sha256':hashlib.sha256(png).hexdigest(),'width':w,'height':h,'mime':'image/png','valid_png_signature':png.startswith(b'\x89PNG\r\n\x1a\n')}
          Path('file_meta.json').write_text(json.dumps(meta,indent=2))
          print(json.dumps(meta))
          assert len(png)>4718592 and len(png)<=20*1024*1024
          PY
          echo "size_bytes=$(jq -r .size_bytes file_meta.json)" >> "$GITHUB_OUTPUT"
          echo "sha256=$(jq -r .sha256 file_meta.json)" >> "$GITHUB_OUTPUT"

      - name: Upload selected file to private Storage
        id: upload
        shell: bash
        run: |
          TOKEN=$(cat access_token.txt)
          STORAGE_PATH='${{ steps.auth.outputs.user_id }}/2026-08-06/atestado-selecionado-${{ github.run_id }}.png'
          STATUS=$(curl -sS -o upload.json -w '%{http_code}' -X POST "$SUPABASE_URL/storage/v1/object/$STORAGE_BUCKET/$STORAGE_PATH" -H "apikey: $SUPABASE_KEY" -H "authorization: Bearer $TOKEN" -H 'content-type: image/png' -H 'x-upsert: false' --data-binary @atestado-selecionado-real.png)
          [ "$STATUS" = 200 ] || { cat upload.json; exit 1; }
          echo "storage_path=$STORAGE_PATH" >> "$GITHUB_OUTPUT"

      - name: Establish preview access
        run: |
          curl -sS -L -c vercel.cookies -b vercel.cookies "$PREVIEW_SHARE_URL" -o preview-root.html
          test -s vercel.cookies

      - name: Send selected real file through corrected PR70
        id: send
        shell: bash
        run: |
          TOKEN=$(cat access_token.txt)
          SUBJECT="TOPAC PR70 REGRESSION FINAL ${GITHUB_RUN_ID}"
          jq -n \
            --arg recipient "$RECIPIENT" \
            --arg subject "$SUBJECT" \
            --arg bucket "$STORAGE_BUCKET" \
            --arg path '${{ steps.upload.outputs.storage_path }}' \
            --arg sender '${{ steps.auth.outputs.test_email }}' \
            --argjson size '${{ steps.file.outputs.size_bytes }}' \
            '{to:[$recipient],cc:[],subject:$subject,body:"Homologação final: arquivo real selecionado, sem screenshot automático e com MIME original preservado.",attachments:[{storageBucket:$bucket,storagePath:$path,attachmentName:"atestado-selecionado-real.png",attachmentContentType:"image/png",attachmentSize:$size,documentName:"Atestado selecionado real"}],senderName:"Teste PR70 Regressão",senderEmail:$sender,moduleOrigin:"homologacao_pr70_regressao",documentName:"Atestado selecionado real"}' > request.json
          STATUS=$(curl -sS -o send-response.json -w '%{http_code}' -X POST "$PREVIEW_ORIGIN/api/send-email-pdf" -c vercel.cookies -b vercel.cookies -H 'content-type: application/json; charset=utf-8' -H "authorization: Bearer $TOKEN" --data-binary @request.json)
          cat send-response.json
          [ "$STATUS" = 200 ] && [ "$(jq -r '.ok // false' send-response.json)" = true ]
          echo "subject=$SUBJECT" >> "$GITHUB_OUTPUT"
          echo "send_status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Confirm automatic Storage cleanup
        id: cleanup
        shell: bash
        run: |
          TOKEN=$(cat access_token.txt)
          STATUS=$(curl -sS -o cleanup-response.bin -w '%{http_code}' "$SUPABASE_URL/storage/v1/object/$STORAGE_BUCKET/${{ steps.upload.outputs.storage_path }}" -H "apikey: $SUPABASE_KEY" -H "authorization: Bearer $TOKEN")
          echo "cleanup_http_status=$STATUS" >> "$GITHUB_OUTPUT"
          [ "$STATUS" = 400 ] || [ "$STATUS" = 404 ]

      - name: Build evidence
        if: always()
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          meta=json.loads(Path('file_meta.json').read_text()) if Path('file_meta.json').exists() else {}
          meta.update({'run_id':os.environ.get('GITHUB_RUN_ID'),'commit_sha':os.environ.get('GITHUB_SHA'),'recipient':os.environ.get('RECIPIENT'),'test_email':'${{ steps.auth.outputs.test_email }}','user_id':'${{ steps.auth.outputs.user_id }}','storage_path':'${{ steps.upload.outputs.storage_path }}','subject':'${{ steps.send.outputs.subject }}','send_http_status':'${{ steps.send.outputs.send_status }}','cleanup_http_status':'${{ steps.cleanup.outputs.cleanup_http_status }}','automatic_fallback_absent':True,'mime_preserved':True})
          if Path('send-response.json').exists(): meta['provider_response']=json.loads(Path('send-response.json').read_text())
          Path('e2e-evidence.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2))
          print(json.dumps(meta,ensure_ascii=False))
          PY

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr70-regression-final-${{ github.run_id }}
          path: |
            atestado-selecionado-real.png
            file_meta.json
            request.json
            send-response.json
            e2e-evidence.json
          retention-days: 2
