name: Patch Unified Benefit Flow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-unified-benefit-flow.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply unified benefit patches
        run: python scripts/patch_unified_benefit_flow.py
      - name: Validate production build
        run: |
          npm install --legacy-peer-deps --package-lock=false
          npm run build
      - name: Commit unified benefit flow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/BenefitValuePaymentEditor.tsx src/pages/RelatorioVTPage.tsx src/pages/RelatorioVRPage.tsx
          git commit -m "fix(benefits): unificar geracao e complementos de VR e VT"
          git push origin HEAD:main
