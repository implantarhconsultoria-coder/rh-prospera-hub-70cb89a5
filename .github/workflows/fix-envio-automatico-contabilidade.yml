name: Corrigir envio automatico contabilidade

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-envio-automatico-contabilidade.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Aplicar ajuste isolado
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/pages/PreCadastroAdmissionalOcrPage.tsx';
          let text = fs.readFileSync(path, 'utf8');

          const oldImport = "import { CC_OBRIGATORIO } from '@/lib/emailUtils';";
          const newImport = "import { CC_OBRIGATORIO, sendEmailWithPdfAttachment } from '@/lib/emailUtils';";
          if (!text.includes(oldImport)) throw new Error('Import esperado não encontrado');
          text = text.replace(oldImport, newImport);

          const oldFn = "  const enviarContabilidade = async () => { if (!selectedDocs.length) return toast.error('Selecione pelo menos um documento.'); if (!window.confirm(`Preparar e-mail com ${selectedDocs.length} anexo(s)?`)) return; const attachments = await carregarAnexosSelecionados(); setEmailPdfDraft({ to: CONTABILIDADE_DESTINATARIOS, cc: Array.from(CC_OBRIGATORIO), subject: `Documentação admissional - ${form.nome || ''} - ${form.empresa_nome || ''}`, body: buildContabilidadeEmailBody(form), attachments, moduleOrigin: 'pre-cadastro admissional', documentName: `Documentação admissional - ${form.nome || ''}` }); };";
          const newFn = "  const enviarContabilidade = async () => { if (!selectedDocs.length) return toast.error('Selecione pelo menos um documento.'); if (!window.confirm(`Enviar e-mail automaticamente com ${selectedDocs.length} anexo(s)?`)) return; try { const attachments = await carregarAnexosSelecionados(); const { data: sessionData } = await supabase.auth.getSession(); const authUser = sessionData.session?.user; await sendEmailWithPdfAttachment({ to: CONTABILIDADE_DESTINATARIOS, cc: Array.from(CC_OBRIGATORIO), subject: `Documentação admissional - ${form.nome || ''} - ${form.empresa_nome || ''}`, body: buildContabilidadeEmailBody(form), attachments, senderUserId: authUser?.id, senderName: String(authUser?.user_metadata?.nome_completo || authUser?.email || ''), senderEmail: authUser?.email, moduleOrigin: 'pre-cadastro admissional', documentName: `Documentação admissional - ${form.nome || ''}`, authToken: sessionData.session?.access_token }); toast.success('E-mail enviado automaticamente para a contabilidade.'); } catch (error: any) { toast.error(error?.message || 'Não foi possível enviar o e-mail automaticamente.'); } };";
          if (!text.includes(oldFn)) throw new Error('Função esperada não encontrada');
          text = text.replace(oldFn, newFn);

          fs.writeFileSync(path, text);
          fs.rmSync('.github/workflows/fix-envio-automatico-contabilidade.yml');
          NODE
      - name: Instalar dependencias e validar build
        run: |
          npm ci
          npm run build
      - name: Commitar somente a correcao
        run: |
          git config user.name "TOPAC Automation"
          git config user.email "actions@github.com"
          git add src/pages/PreCadastroAdmissionalOcrPage.tsx .github/workflows/fix-envio-automatico-contabilidade.yml
          git commit -m "fix: restaurar envio automatico para contabilidade"
          git push origin main
