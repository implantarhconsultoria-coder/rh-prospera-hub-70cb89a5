name: Temporary manual signature export
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-manual-signature-export-20260918.yml"

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download generated PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export
          curl -fL "https://djfjnxmbvjgweqzjvqtr.supabase.co/storage/v1/object/public/temp-manual-signature-export-20260918/topac-matriz/a1f74c52-d0e5-404a-bc53-70a6272fa4d4.pdf" -o "export/ASSINATURAS_MANUAIS_TOPAC_MATRIZ_2026-08-20_A_2026-09-20.pdf"
          curl -fL "https://djfjnxmbvjgweqzjvqtr.supabase.co/storage/v1/object/public/temp-manual-signature-export-20260918/topac-praia-grande/6d9fa865-17c3-4db3-8d5c-74041a97efe7.pdf" -o "export/ASSINATURAS_MANUAIS_TOPAC_PRAIA_GRANDE_2026-08-20_A_2026-09-20.pdf"
          curl -fL "https://djfjnxmbvjgweqzjvqtr.supabase.co/storage/v1/object/public/temp-manual-signature-export-20260918/topac-goiania/db60e10b-1465-4ef0-815a-62cc2cf8084f.pdf" -o "export/ASSINATURAS_MANUAIS_TOPAC_GOIANIA_2026-08-20_A_2026-09-20.pdf"
          curl -fL "https://djfjnxmbvjgweqzjvqtr.supabase.co/storage/v1/object/public/temp-manual-signature-export-20260918/alqui-obras/340a31ad-4797-4aa1-ab1f-c75b59ddf068.pdf" -o "export/ASSINATURAS_MANUAIS_ALQUI_OBRAS_2026-08-20_A_2026-09-20.pdf"
          curl -fL "https://djfjnxmbvjgweqzjvqtr.supabase.co/storage/v1/object/public/temp-manual-signature-export-20260918/lmt/7bcb912b-a291-4b2b-9682-4b881d0693b3.pdf" -o "export/ASSINATURAS_MANUAIS_LMT_2026-08-20_A_2026-09-20.pdf"
          ls -lh export
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: assinaturas-manuais-finais-20260918
          path: export/*.pdf
          if-no-files-found: error
          retention-days: 1
