name: Patch rescisao Goiania 1709

on:
  push:
    branches:
      - fix/rescisao-goiania-fluxo-email-1709
    paths:
      - .github/workflows/patch-rescisao-goiania-1709.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rescisao-goiania-fluxo-email-1709
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply changes
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new, count=None):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Pattern not found in {path}: {old[:100]}')
              text = text.replace(old, new, count if count is not None else -1)
              p.write_text(text)

          # 1) Carta de demissao somente no fluxo de Rescisoes.
          replace(
              'src/main.tsx',
              "const isPedidoDemissao = path === '/admin/rescisoes' || path === '/admin/funcionarios' || centralModule === 'rescisao';",
              "const isPedidoDemissao = path === '/admin/rescisoes' || centralModule === 'rescisao';",
          )

          # 2) Cria ponto fixo no cabecalho da Rescisao para o modelo de carta.
          replace(
              'src/pages/RescisaoPage.tsx',
              "        <Dialog open={open} onOpenChange={(next) => { setOpen(next); if (!next) setMemoryOpen(false); }}>",
              "        <div id=\"rescisao-carta-anchor\" className=\"flex items-center gap-2\" />\n        <Dialog open={open} onOpenChange={(next) => { setOpen(next); if (!next) setMemoryOpen(false); }}>",
              1,
          )

          # 3) Destinatarios dinamicos de rescisao conforme unidade.
          replace(
              'src/pages/RescisaoPage.tsx',
              "import { DESTINATARIOS_CONTABILIDADE, CC_OBRIGATORIO } from '@/lib/emailUtils';",
              "import { getCcRescisao, getDestinatariosRescisao } from '@/lib/emailUtils';",
          )

          p = Path('src/pages/RescisaoPage.tsx')
          text = p.read_text()
          old = """    setEmailPdfDraft({\n      to: [...DESTINATARIOS_CONTABILIDADE], cc: [...CC_OBRIGATORIO],\n      subject: `Memória de Cálculo da Rescisão - ${row.funcionario_nome || ''}`,"""
          new = """    const destinatariosRescisao = [...getDestinatariosRescisao(row.empresa_nome || '')];\n    const copiaRescisao = [...getCcRescisao(row.empresa_nome || '')];\n    setEmailPdfDraft({\n      to: destinatariosRescisao, cc: copiaRescisao,\n      subject: `Memória de Cálculo da Rescisão - ${row.funcionario_nome || ''}`,"""
          if old not in text:
              raise SystemExit('Bloco de envio da rescisao nao encontrado')
          text = text.replace(old, new, 1)
          old2 = "await marcarComoEnviado(registro.id, session.user.id, nomeUsuario, [...DESTINATARIOS_CONTABILIDADE, ...CC_OBRIGATORIO].join(', '));"
          new2 = "await marcarComoEnviado(registro.id, session.user.id, nomeUsuario, [...destinatariosRescisao, ...copiaRescisao].join(', '));"
          if old2 not in text:
              raise SystemExit('Historico de destinatarios da rescisao nao encontrado')
          text = text.replace(old2, new2, 1)
          p.write_text(text)

          # 4) Botao do modelo deixa de ser flutuante e e renderizado no ponto fixo da Rescisao.
          p = Path('src/components/PedidoDemissaoModelDialog.tsx')
          text = p.read_text()
          text = text.replace(
              "import React, { useEffect, useMemo, useState } from 'react';",
              "import React, { useEffect, useMemo, useState } from 'react';\nimport { createPortal } from 'react-dom';",
              1,
          )
          marker = "  const [motivoOutro, setMotivoOutro] = useState('');"
          if marker not in text:
              raise SystemExit('Estado do dialogo de carta nao encontrado')
          text = text.replace(marker, marker + "\n  const [mountTarget, setMountTarget] = useState<HTMLElement | null>(null);\n\n  useEffect(() => {\n    const locate = () => setMountTarget(document.getElementById('rescisao-carta-anchor'));\n    locate();\n    const timer = window.setInterval(locate, 300);\n    return () => window.clearInterval(timer);\n  }, []);", 1)
          old_return = "  return (\n    <Dialog open={open} onOpenChange={(next) => { setOpen(next); if (!next) setPreview(false); }}>"
          new_return = "  if (!mountTarget) return null;\n\n  return createPortal((\n    <Dialog open={open} onOpenChange={(next) => { setOpen(next); if (!next) setPreview(false); }}>"
          if old_return not in text:
              raise SystemExit('Return do dialogo de carta nao encontrado')
          text = text.replace(old_return, new_return, 1)
          text = text.replace(
              '<Button className="fixed bottom-24 right-6 z-[65] shadow-xl no-print" size="lg">',
              '<Button className="no-print shadow-sm" size="sm" variant="outline">',
              1,
          )
          tail = "  );\n};\n\nexport default PedidoDemissaoModelDialog;"
          if tail not in text:
              raise SystemExit('Final do dialogo de carta nao encontrado')
          text = text.replace(tail, "  ), mountTarget);\n};\n\nexport default PedidoDemissaoModelDialog;", 1)
          p.write_text(text)

          # 5) Regras centralizadas de destinatarios de Goiania.
          p = Path('src/lib/emailUtils.ts')
          text = p.read_text()
          text = text.replace(
              "export const EMAIL_GOIANIA = 'adm.gyn@topac.com.br' as const;",
              "export const EMAIL_GOIANIA = 'adm.gyn@topac.com.br' as const;\nexport const EMAIL_CONTABILIDADE_GOIANIA = 'requisicao@incocontabilidade.com.br' as const;",
              1,
          )
          old = """export const getDestinatariosFerias = (unidade: string): readonly string[] => {\n  const normalized = String(unidade || '').normalize('NFD').replace(/[\\u0300-\\u036f]/g, '').toUpperCase();\n  return normalized.includes('GOIANIA') || normalized.includes('GOIANA')\n    ? ['requisicao@incocontabilidade.com.br']\n    : DESTINATARIOS_CONTABILIDADE;\n};\n\nexport const getDestinatariosRescisao = (unidade: string): readonly string[] => getDestinatariosFerias(unidade);"""
          new = """const isGoianiaUnit = (unidade: string) => {\n  const normalized = String(unidade || '').normalize('NFD').replace(/[\\u0300-\\u036f]/g, '').toUpperCase();\n  return normalized.includes('GOIANIA') || normalized.includes('GOIANA') || normalized.includes('GYN');\n};\n\nexport const getCcRh = (unidade: string): readonly string[] =>\n  isGoianiaUnit(unidade)\n    ? [...CC_OBRIGATORIO, EMAIL_GOIANIA]\n    : CC_OBRIGATORIO;\n\nexport const getDestinatariosFerias = (unidade: string): readonly string[] =>\n  isGoianiaUnit(unidade) ? [EMAIL_CONTABILIDADE_GOIANIA] : DESTINATARIOS_CONTABILIDADE;\n\nexport const getDestinatariosRescisao = (unidade: string): readonly string[] =>\n  isGoianiaUnit(unidade) ? [EMAIL_CONTABILIDADE_GOIANIA] : DESTINATARIOS_CONTABILIDADE;\n\nexport const getCcRescisao = (unidade: string): readonly string[] => getCcRh(unidade);"""
          if old not in text:
              raise SystemExit('Helpers de destinatarios nao encontrados')
          text = text.replace(old, new, 1)
          p.write_text(text)

          # 6) Politica geral: qualquer e-mail de contexto Goiania recebe ADM GYN;
          # fechamento/apontamento de Goiania tambem inclui Dona Flavia.
          p = Path('src/lib/emailPolicy.ts')
          text = p.read_text()
          text = text.replace(
              "export const ACCOUNTING_MARISA = 'marisa@aatconsultoria.com.br' as const;",
              "export const ACCOUNTING_MARISA = 'marisa@aatconsultoria.com.br' as const;\nexport const TOPAC_GOIANIA_ADMIN = 'adm.gyn@topac.com.br' as const;\nexport const ACCOUNTING_GOIANIA_FLAVIA = 'requisicao@incocontabilidade.com.br' as const;",
              1,
          )
          old = """export const applyTopacEmailPolicy = (input: EmailPolicyInput) => {\n  const report = isReportOrSpreadsheetEmail(input);\n  const accountingCc = accountingCcFor(input.to);\n  const mandatoryCc = uniqueEmails([\n    ...(input.cc || []),\n    ...accountingCc,\n    ...(report ? TOPAC_REPORT_CC : []),\n  ]);"""
          new = """export const applyTopacEmailPolicy = (input: EmailPolicyInput) => {\n  const report = isReportOrSpreadsheetEmail(input);\n  const accountingCc = accountingCcFor(input.to);\n  const context = normalize([input.subject, input.body, input.moduleOrigin, ...(input.attachmentNames || [])].join(' '));\n  const goianiaContext = context.includes('goiania') || context.includes('gyn') || context.includes('topac filial goiania');\n  const fechamentoOuApontamento = context.includes('fechamento') || context.includes('apontamento');\n  const mandatoryCc = uniqueEmails([\n    ...(input.cc || []),\n    ...accountingCc,\n    ...(report ? TOPAC_REPORT_CC : []),\n    ...(goianiaContext ? [TOPAC_GOIANIA_ADMIN] : []),\n    ...(goianiaContext && fechamentoOuApontamento ? [ACCOUNTING_GOIANIA_FLAVIA] : []),\n  ]);"""
          if old not in text:
              raise SystemExit('Politica de email nao encontrada')
          text = text.replace(old, new, 1)
          p.write_text(text)

          # Workflow temporario nao deve permanecer no projeto.
          Path('.github/workflows/patch-rescisao-goiania-1709.yml').unlink()

      - run: npm ci
      - run: npm run build

      - name: Commit patched files
        run: |
          git config user.name "topac-rh-pro-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/main.tsx src/pages/RescisaoPage.tsx src/components/PedidoDemissaoModelDialog.tsx src/lib/emailUtils.ts src/lib/emailPolicy.ts .github/workflows/patch-rescisao-goiania-1709.yml
          git commit -m "fix: separa rescisao de Goiania e fixa modelo de carta"
          git push origin HEAD:fix/rescisao-goiania-fluxo-email-1709
