name: Patch Goiania Email Policy

on:
  push:
    branches:
      - fix/goiania-rescisao-fluxo-1709-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/goiania-rescisao-fluxo-1709-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar politica global de destinatarios de Goiania
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/lib/emailPolicy.ts')
          s = p.read_text()
          if 'GOIANIA_ADMIN_EMAIL' not in s:
              anchor = "export const ACCOUNTING_MARISA = 'marisa@aatconsultoria.com.br' as const;\n"
              if anchor not in s: raise SystemExit('Anchor de emailPolicy nao encontrado')
              s = s.replace(anchor, anchor + "export const GOIANIA_ADMIN_EMAIL = 'adm.gyn@topac.com.br' as const;\nexport const GOIANIA_ACCOUNTING_EMAIL = 'requisicao@incocontabilidade.com.br' as const;\n", 1)

          anchor2 = """const uniqueEmails = (values: readonly string[] = []) => Array.from(new Set(\n  values.map((value) => String(value || '').trim().toLowerCase()).filter(Boolean).filter((email) => !EMAILS_REMOVIDOS.has(email)),\n));\n"""
          if 'isGoianiaContext' not in s:
              extra = """\nconst routingText = (input: EmailPolicyInput) => normalize([\n  input.subject,\n  input.body,\n  input.moduleOrigin,\n  ...(input.attachmentNames || []),\n].join(' '));\n\nconst isGoianiaContext = (input: EmailPolicyInput) => {\n  const text = routingText(input);\n  return text.includes('goiania') || text.includes('goiana') || /\\bgyn\\b/.test(text);\n};\n\nconst isFechamentoOuApontamento = (input: EmailPolicyInput) => {\n  const text = routingText(input);\n  return text.includes('fechamento') || text.includes('apontamento');\n};\n"""
              if anchor2 not in s: raise SystemExit('uniqueEmails nao encontrado')
              s = s.replace(anchor2, anchor2 + extra, 1)

          old = """export const applyTopacEmailPolicy = (input: EmailPolicyInput) => {\n  const report = isReportOrSpreadsheetEmail(input);\n  const accountingCc = accountingCcFor(input.to);\n  const mandatoryCc = uniqueEmails([\n    ...(input.cc || []),\n    ...accountingCc,\n    ...(report ? TOPAC_REPORT_CC : []),\n  ]);\n\n  if (!report) {\n    return {\n      body: String(input.body || '').trim(),\n      cc: mandatoryCc,\n      institutional: accountingCc.length > 0,\n    };\n  }\n\n  const content = stripExistingSignature(String(input.body || ''));\n  return {\n    body: `${content}${content ? '\\n\\n' : ''}${TOPAC_REPORT_SIGNATURE}`,\n    cc: mandatoryCc,\n    institutional: true,\n  };\n};\n"""
          new = """export const applyTopacEmailPolicy = (input: EmailPolicyInput) => {\n  const report = isReportOrSpreadsheetEmail(input);\n  const goiania = isGoianiaContext(input);\n  const fechamentoOuApontamento = goiania && isFechamentoOuApontamento(input);\n  const policyTo = uniqueEmails([\n    ...(input.to || []),\n    ...(fechamentoOuApontamento ? [GOIANIA_ACCOUNTING_EMAIL] : []),\n  ]);\n  const accountingCc = accountingCcFor(policyTo);\n  const mandatoryCc = uniqueEmails([\n    ...(input.cc || []),\n    ...accountingCc,\n    ...(goiania ? [GOIANIA_ADMIN_EMAIL] : []),\n    ...(report ? TOPAC_REPORT_CC : []),\n  ]);\n\n  if (!report) {\n    return {\n      to: policyTo,\n      body: String(input.body || '').trim(),\n      cc: mandatoryCc,\n      institutional: accountingCc.length > 0 || goiania,\n    };\n  }\n\n  const content = stripExistingSignature(String(input.body || ''));\n  return {\n    to: policyTo,\n    body: `${content}${content ? '\\n\\n' : ''}${TOPAC_REPORT_SIGNATURE}`,\n    cc: mandatoryCc,\n    institutional: true,\n  };\n};\n"""
          if old not in s: raise SystemExit('applyTopacEmailPolicy original nao encontrado')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('src/lib/emailUtils.ts')
          s = p.read_text()
          old_mailto = "  window.location.href = `mailto:${normalizedTo.map(enc).join(',')}?${params.join('&')}`;"
          new_mailto = "  window.location.href = `mailto:${policy.to.map(enc).join(',')}?${params.join('&')}`;"
          if old_mailto not in s: raise SystemExit('mailto nao encontrado')
          s = s.replace(old_mailto, new_mailto, 1)
          old_send = "        to: normalizedTo,\n        cc: policy.cc,"
          new_send = "        to: policy.to,\n        cc: policy.cc,"
          if old_send not in s: raise SystemExit('payload send-email nao encontrado')
          s = s.replace(old_send, new_send, 1)
          p.write_text(s)
          PY
      - name: Validar build
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build
      - name: Commit
        run: |
          git fetch origin main
          git checkout origin/main -- package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-goiania-email-policy.yml
          git add src/lib/emailPolicy.ts src/lib/emailUtils.ts package-lock.json
          git commit -m "fix: aplica politica global de emails de Goiania"
          git push origin HEAD:fix/goiania-rescisao-fluxo-1709-v2
