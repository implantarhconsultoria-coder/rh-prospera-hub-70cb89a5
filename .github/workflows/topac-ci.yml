name: TOPAC CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: topac-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        # package-lock.json está defasado em relação ao package.json; alinhar com o build que já valida em produção.
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Lint changed scope
        run: >-
          npx eslint
          src/lib/emailPolicy.ts
          src/lib/bankingParser.ts
          src/lib/abastecimentoReports.ts
          src/lib/emailUtils.ts
          src/lib/funcionariosBase.ts
          src/lib/smartTextParser.ts
          src/lib/vehicleSync.ts
          src/lib/savePdf.ts
          src/lib/rescisaoCalc.ts
          src/lib/rescisaoPdf.ts
          src/lib/epiRules.ts
          src/components/BankingDataEditor.tsx
          src/components/EmailPdfModal.tsx
          src/components/EmployeeSmartTextPanel.tsx
          src/components/EmployeeSmartEditOverlay.tsx
          src/components/AppLayout.tsx
          src/components/FilialLayout.tsx
          src/components/EpiSemestralAlert.tsx
          src/pages/FuncionariosPage.tsx
          src/pages/ProtocoloPage.tsx
          src/pages/RelatorioImpressaoPage.tsx
          src/pages/RelatorioBeneficioIndividualPage.tsx
          src/pages/RescisaoPage.tsx
          src/pages/EPIPage.tsx
          src/pages/admin/CombustivelQRAdminPage.tsx
          src/lib/__tests__/bankingParser.test.ts
          src/lib/__tests__/abastecimentoReports.test.ts
          src/lib/__tests__/emailPolicy.test.ts
          src/lib/__tests__/emailAttachmentTransport.test.ts
          src/lib/__tests__/pdfStandardization.test.ts
          src/lib/__tests__/rescisaoCalc.test.ts
          src/lib/__tests__/rescisaoIntegration.test.ts
          src/lib/__tests__/smartTextParser.test.ts
          src/lib/__tests__/vehicleSync.test.ts
          src/lib/__tests__/protocoloFrotaSource.test.ts
          src/lib/__tests__/epiRules.test.ts
          src/components/HistoricoDocumentalFuncionario.tsx
          src/test/HistoricoDocumentalFuncionario.test.tsx
          --rule '@typescript-eslint/no-explicit-any: off'
          --rule 'react-hooks/exhaustive-deps: off'
          --rule 'no-useless-escape: off'

      - name: Extrair erro do Vitest (diagnóstico temporário)
        if: always()
        id: diag
        run: |
          npx vitest run src/test/HistoricoDocumentalFuncionario.test.tsx -t 'mantém exatamente os espaços digitados' > /tmp/vitest-diag.log 2>&1 || true
          touch /tmp/vitest-diag.log
          for variant in first error fail; do
            case "$variant" in
              first) line=$(head -n 4 /tmp/vitest-diag.log | tail -n 1);;
              error) line=$(grep -m1 -Ei 'error|failed|cannot|ERR_|exception' /tmp/vitest-diag.log || true);;
              fail) line=$(grep -m1 -E 'FAIL|Test Files|Failed to|TypeError|AssertionError|Error:' /tmp/vitest-diag.log || true);;
            esac
            normalized=$(printf '%s' "$line" | tr -c '[:alnum:] _.-' '_' | cut -c1-150)
            echo "${variant}=diagnostico-${variant}-${normalized:-sem_resultado}" >> "$GITHUB_OUTPUT"
          done

      - name: Diagnóstico de inicialização
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.diag.outputs.first }}
          path: /tmp/vitest-diag.log

      - name: Diagnóstico de erro
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.diag.outputs.error }}
          path: /tmp/vitest-diag.log

      - name: Diagnóstico de falha
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.diag.outputs.fail }}
          path: /tmp/vitest-diag.log

      - name: Build
        run: npm run build
