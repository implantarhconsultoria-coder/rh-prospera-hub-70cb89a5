name: TOPAC CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: topac-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        # package-lock.json está defasado em relação ao package.json; alinhar com o build que já valida em produção.
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Lint changed scope
        run: >-
          npx eslint
          src/lib/emailPolicy.ts
          src/lib/bankingParser.ts
          src/lib/abastecimentoReports.ts
          src/lib/emailUtils.ts
          src/lib/funcionariosBase.ts
          src/lib/smartTextParser.ts
          src/lib/vehicleSync.ts
          src/lib/savePdf.ts
          src/lib/rescisaoCalc.ts
          src/lib/rescisaoPdf.ts
          src/lib/epiRules.ts
          src/components/BankingDataEditor.tsx
          src/components/EmailPdfModal.tsx
          src/components/EmployeeSmartTextPanel.tsx
          src/components/EmployeeSmartEditOverlay.tsx
          src/components/AppLayout.tsx
          src/components/FilialLayout.tsx
          src/components/EpiSemestralAlert.tsx
          src/pages/FuncionariosPage.tsx
          src/pages/ProtocoloPage.tsx
          src/pages/RelatorioImpressaoPage.tsx
          src/pages/RelatorioBeneficioIndividualPage.tsx
          src/pages/RescisaoPage.tsx
          src/pages/EPIPage.tsx
          src/pages/admin/CombustivelQRAdminPage.tsx
          src/lib/__tests__/bankingParser.test.ts
          src/lib/__tests__/abastecimentoReports.test.ts
          src/lib/__tests__/emailPolicy.test.ts
          src/lib/__tests__/emailAttachmentTransport.test.ts
          src/lib/__tests__/pdfStandardization.test.ts
          src/lib/__tests__/rescisaoCalc.test.ts
          src/lib/__tests__/rescisaoIntegration.test.ts
          src/lib/__tests__/smartTextParser.test.ts
          src/lib/__tests__/vehicleSync.test.ts
          src/lib/__tests__/protocoloFrotaSource.test.ts
          src/lib/__tests__/epiRules.test.ts
          src/components/HistoricoDocumentalFuncionario.tsx
          src/test/HistoricoDocumentalFuncionario.test.tsx
          --rule '@typescript-eslint/no-explicit-any: off'
          --rule 'react-hooks/exhaustive-deps: off'
          --rule 'no-useless-escape: off'

      - name: Identificar falhas documentais (temporário)
        id: diag
        run: |
          FORCE_COLOR=0 npx vitest run src/test/HistoricoDocumentalFuncionario.test.tsx --reporter=verbose > /tmp/rh-test.log 2>&1 || true
          touch /tmp/rh-test.log
          for label in fail first second third error testcase; do
            case "$label" in
              fail) line=$(grep -m1 -i -E 'test files|tests  |failed' /tmp/rh-test.log || true);;
              first) line=$(grep -m1 -E '^ *FAIL +|^ *×' /tmp/rh-test.log || true);;
              second) line=$(grep -E '^ *FAIL +|^ *×' /tmp/rh-test.log | sed -n '2p' || true);;
              third) line=$(grep -E '^ *FAIL +|^ *×' /tmp/rh-test.log | sed -n '3p' || true);;
              error) line=$(grep -m1 -Ei 'Error:|AssertionError:|TypeError:|Cannot find|Failed to|expected .* to' /tmp/rh-test.log || true);;
              testcase) line=$(awk '/ FAIL / {found=1;next} found && NF {print;exit}' /tmp/rh-test.log);;
            esac
            normalized=$(printf '%s' "$line" | tr -c '[:alnum:] _.,()=+-' '_' | cut -c1-175)
            echo "${label}=rh-${label}-${normalized:-sem_resultado}" >> "$GITHUB_OUTPUT"
          done

      - name: Diagnóstico RH falha
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.diag.outputs.fail }}
          path: /tmp/rh-test.log
      - name: Diagnóstico RH primeira
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.diag.outputs.first }}
          path: /tmp/rh-test.log
      - name: Diagnóstico RH segunda
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.diag.outputs.second }}
          path: /tmp/rh-test.log
      - name: Diagnóstico RH terceira
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.diag.outputs.third }}
          path: /tmp/rh-test.log
      - name: Diagnóstico RH erro
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.diag.outputs.error }}
          path: /tmp/rh-test.log
      - name: Diagnóstico RH caso
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.diag.outputs.testcase }}
          path: /tmp/rh-test.log

      - name: Tests changed scope
        run: |
          set -o pipefail
          FORCE_COLOR=0 npx vitest run src/lib/__tests__/bankingParser.test.ts src/lib/__tests__/abastecimentoReports.test.ts src/lib/__tests__/emailPolicy.test.ts src/lib/__tests__/emailAttachmentTransport.test.ts src/lib/__tests__/pdfStandardization.test.ts src/lib/__tests__/rescisaoCalc.test.ts src/lib/__tests__/rescisaoIntegration.test.ts src/lib/__tests__/smartTextParser.test.ts src/lib/__tests__/vehicleSync.test.ts src/lib/__tests__/protocoloFrotaSource.test.ts src/lib/__tests__/epiRules.test.ts src/test/HistoricoDocumentalFuncionario.test.tsx 2>&1 | tee /tmp/legacy-tests.log

      - name: Diagnosticar falhas legadas (temporário)
        if: always()
        id: legacy
        run: |
          touch /tmp/legacy-tests.log
          for label in summary one two three four error; do
            case "$label" in
              summary) line=$(grep -m1 -E 'Test Files|Tests ' /tmp/legacy-tests.log || true);;
              one) line=$(grep -E '^ *FAIL ' /tmp/legacy-tests.log | sed -n '1p' || true);;
              two) line=$(grep -E '^ *FAIL ' /tmp/legacy-tests.log | sed -n '2p' || true);;
              three) line=$(grep -E '^ *FAIL ' /tmp/legacy-tests.log | sed -n '3p' || true);;
              four) line=$(grep -E '^ *FAIL ' /tmp/legacy-tests.log | sed -n '4p' || true);;
              error) line=$(grep -m1 -Ei '^ *(AssertionError:|Error:|TypeError:|ReferenceError:|Cannot find|Failed to)' /tmp/legacy-tests.log || true);;
            esac
            normalized=$(printf '%s' "$line" | tr -c '[:alnum:] _.,()=+-' '_' | cut -c1-170)
            echo "${label}=legacy-${label}-${normalized:-sem_resultado}" >> "$GITHUB_OUTPUT"
          done

      - name: Legado summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.legacy.outputs.summary }}
          path: /tmp/legacy-tests.log

      - name: Legado one
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.legacy.outputs.one }}
          path: /tmp/legacy-tests.log

      - name: Legado two
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.legacy.outputs.two }}
          path: /tmp/legacy-tests.log

      - name: Legado three
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.legacy.outputs.three }}
          path: /tmp/legacy-tests.log

      - name: Legado four
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.legacy.outputs.four }}
          path: /tmp/legacy-tests.log

      - name: Legado error
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.legacy.outputs.error }}
          path: /tmp/legacy-tests.log

      - name: Build
        run: npm run build
