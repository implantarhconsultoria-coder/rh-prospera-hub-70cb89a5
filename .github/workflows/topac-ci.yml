name: TOPAC CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: topac-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        # package-lock.json está defasado em relação ao package.json; alinhar com o build que já valida em produção.
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Lint changed scope
        run: >-
          npx eslint
          src/lib/emailPolicy.ts
          src/lib/bankingParser.ts
          src/lib/abastecimentoReports.ts
          src/lib/emailUtils.ts
          src/lib/funcionariosBase.ts
          src/lib/smartTextParser.ts
          src/lib/vehicleSync.ts
          src/lib/savePdf.ts
          src/lib/rescisaoCalc.ts
          src/lib/rescisaoPdf.ts
          src/lib/epiRules.ts
          src/components/BankingDataEditor.tsx
          src/components/EmailPdfModal.tsx
          src/components/EmployeeSmartTextPanel.tsx
          src/components/EmployeeSmartEditOverlay.tsx
          src/components/AppLayout.tsx
          src/components/FilialLayout.tsx
          src/components/EpiSemestralAlert.tsx
          src/pages/FuncionariosPage.tsx
          src/pages/ProtocoloPage.tsx
          src/pages/RelatorioImpressaoPage.tsx
          src/pages/RelatorioBeneficioIndividualPage.tsx
          src/pages/RescisaoPage.tsx
          src/pages/EPIPage.tsx
          src/pages/admin/CombustivelQRAdminPage.tsx
          src/lib/__tests__/bankingParser.test.ts
          src/lib/__tests__/abastecimentoReports.test.ts
          src/lib/__tests__/emailPolicy.test.ts
          src/lib/__tests__/emailAttachmentTransport.test.ts
          src/lib/__tests__/pdfStandardization.test.ts
          src/lib/__tests__/rescisaoCalc.test.ts
          src/lib/__tests__/rescisaoIntegration.test.ts
          src/lib/__tests__/smartTextParser.test.ts
          src/lib/__tests__/vehicleSync.test.ts
          src/lib/__tests__/protocoloFrotaSource.test.ts
          src/lib/__tests__/epiRules.test.ts
          src/components/HistoricoDocumentalFuncionario.tsx
          src/test/HistoricoDocumentalFuncionario.test.tsx
          --rule '@typescript-eslint/no-explicit-any: off'
          --rule 'react-hooks/exhaustive-deps: off'
          --rule 'no-useless-escape: off'

      - name: Testes preexistentes do projeto
        run: >-
          npx vitest run src/lib/__tests__/bankingParser.test.ts src/lib/__tests__/abastecimentoReports.test.ts src/lib/__tests__/emailPolicy.test.ts src/lib/__tests__/emailAttachmentTransport.test.ts src/lib/__tests__/pdfStandardization.test.ts src/lib/__tests__/rescisaoCalc.test.ts src/lib/__tests__/rescisaoIntegration.test.ts src/lib/__tests__/smartTextParser.test.ts src/lib/__tests__/vehicleSync.test.ts src/lib/__tests__/protocoloFrotaSource.test.ts src/lib/__tests__/epiRules.test.ts

      - name: RH | Descrição literal
        if: always()
        run: npx vitest run src/test/HistoricoDocumentalFuncionario.test.tsx -t 'mantém exatamente os espaços digitados na descrição'

      - name: RH | Quebras de linha
        if: always()
        run: npx vitest run src/test/HistoricoDocumentalFuncionario.test.tsx -t 'mantém espaços e quebras de linha'

      - name: RH | Salvamento único
        if: always()
        run: npx vitest run src/test/HistoricoDocumentalFuncionario.test.tsx -t 'salva descrição com espaços'

      - name: RH | E-mail atestado
        if: always()
        run: npx vitest run src/test/HistoricoDocumentalFuncionario.test.tsx -t 'prepara o atestado anexado'

      - name: RH | Visualização EPI
        if: always()
        run: npx vitest run src/test/HistoricoDocumentalFuncionario.test.tsx -t 'mostra visualizar baixar e imprimir'

      - name: RH | Upload múltiplo
        if: always()
        run: npx vitest run src/test/HistoricoDocumentalFuncionario.test.tsx -t 'permite selecionar e registrar três documentos'

      - name: RH | Retentativa sem duplicatas
        if: always()
        run: npx vitest run src/test/HistoricoDocumentalFuncionario.test.tsx -t 'mantém apenas arquivos com falha selecionados'

      - name: RH | Extensões inválidas
        if: always()
        run: npx vitest run src/test/HistoricoDocumentalFuncionario.test.tsx -t 'não envia arquivos vazios'

      - name: Build
        run: npm run build
