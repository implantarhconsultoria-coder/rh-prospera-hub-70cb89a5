name: Fix Payroll Dossier PDF

on:
  push:
    paths:
      - '.github/workflows/patch-payroll-authoritative-time-dossier.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patch dossier generation to server-side PDF
        shell: python
        run: |
          from pathlib import Path

          admin = Path('api/payroll-admin.ts')
          text = admin.read_text(encoding='utf-8')

          if "import { PDFDocument } from 'pdf-lib';" not in text:
              text = "import { PDFDocument } from 'pdf-lib';\n" + text

          marker = "    if (action === 'signed-urls') {"
          if marker not in text:
              raise SystemExit('signed-urls marker not found')

          if "action === 'dossier-pdf'" not in text:
              action = r'''    if (action === 'dossier-pdf') {
      const sourceDoc = await loadDocument(service, String(body.document_id || ''));
      if (!sourceDoc.employee_id) return sendJson(res, { ok: false, error: 'document_without_employee' }, 409);

      const benefitTypes = new Set(['BENEFICIO_VR', 'BENEFICIO_VT', 'BENEFICIO_VR_VT']);
      const payrollTypes = new Set(['HOLERITE', 'ADIANTAMENTO']);
      const shiftCompetencia = (value: string, delta: number) => {
        const match = /^(\d{4})-(\d{2})$/.exec(String(value || ''));
        if (!match) return String(value || '');
        const date = new Date(Date.UTC(Number(match[1]), Number(match[2]) - 1 + delta, 1));
        return `${date.getUTCFullYear()}-${String(date.getUTCMonth() + 1).padStart(2, '0')}`;
      };

      const sourceIsBenefit = benefitTypes.has(String(sourceDoc.document_type || ''));
      const payrollCompetencia = sourceIsBenefit ? shiftCompetencia(sourceDoc.competencia, -1) : sourceDoc.competencia;
      const benefitCompetencia = sourceIsBenefit ? sourceDoc.competencia : shiftCompetencia(sourceDoc.competencia, 1);

      const { data: candidateDocs, error: candidateError } = await service
        .from('payroll_documents')
        .select('id,document_type,competencia,storage_path,extracted_data,document_version')
        .eq('company_id', sourceDoc.company_id)
        .eq('employee_id', sourceDoc.employee_id)
        .in('competencia', Array.from(new Set([payrollCompetencia, benefitCompetencia])));
      if (candidateError) throw candidateError;

      const scopedDocs = (candidateDocs || []).filter((doc: any) =>
        (payrollTypes.has(String(doc.document_type || '')) && doc.competencia === payrollCompetencia)
        || (benefitTypes.has(String(doc.document_type || '')) && doc.competencia === benefitCompetencia),
      );
      const documentIds = scopedDocs.map((doc: any) => doc.id);
      if (!documentIds.length) return sendJson(res, { ok: false, error: 'dossier_without_documents' }, 404);

      const [{ data: signatures, error: signatureError }, { data: receipts, error: receiptError }] = await Promise.all([
        service.from('payroll_signatures')
          .select('id,document_id,certificate_path,signed_at')
          .in('document_id', documentIds)
          .order('signed_at', { ascending: true }),
        service.from('payroll_payment_receipts')
          .select('document_id,storage_path,status')
          .in('document_id', documentIds)
          .eq('status', 'PAGAMENTO_CONFIRMADO'),
      ]);
      if (signatureError) throw signatureError;
      if (receiptError) throw receiptError;

      const docById = new Map(scopedDocs.map((doc: any) => [doc.id, doc]));
      const receiptByDoc = new Map((receipts || []).map((receipt: any) => [receipt.document_id, receipt]));
      const typeOrder: Record<string, number> = { HOLERITE: 10, ADIANTAMENTO: 20, BENEFICIO_VR: 30, BENEFICIO_VT: 40, BENEFICIO_VR_VT: 50 };
      const signedRows = (signatures || [])
        .map((signature: any) => ({ signature, doc: docById.get(signature.document_id) as any }))
        .filter((entry: any) => entry.doc?.storage_path)
        .sort((a: any, b: any) =>
          (typeOrder[a.doc.document_type] || 99) - (typeOrder[b.doc.document_type] || 99)
          || new Date(a.signature.signed_at).getTime() - new Date(b.signature.signed_at).getTime(),
        );
      if (!signedRows.length) return sendJson(res, { ok: false, error: 'dossier_without_signed_documents' }, 409);

      const output = await PDFDocument.create();
      const appendPdf = async (storagePath: string | null | undefined, label: string) => {
        if (!storagePath) return;
        const { data, error } = await service.storage.from(PAYROLL_BUCKET).download(storagePath);
        if (error || !data) throw new Error(`dossier_file_download_failed:${label}`);
        const bytes = new Uint8Array(await data.arrayBuffer());
        const source = await PDFDocument.load(bytes, { ignoreEncryption: true, updateMetadata: false });
        const pages = await output.copyPages(source, source.getPageIndices());
        pages.forEach((page) => output.addPage(page));
      };

      for (const { signature, doc } of signedRows) {
        await appendPdf(doc.storage_path, `${doc.document_type}:document`);
        const receipt = receiptByDoc.get(doc.id) as any;
        if (doc?.extracted_data?.includes_bank_proof !== true && receipt?.storage_path) {
          await appendPdf(receipt.storage_path, `${doc.document_type}:receipt`);
        }
        if (signature.certificate_path) {
          await appendPdf(signature.certificate_path, `${doc.document_type}:certificate`);
        }
      }

      if (!output.getPageCount()) return sendJson(res, { ok: false, error: 'dossier_empty' }, 409);
      const pdfBytes = await output.save({ addDefaultPage: false, useObjectStreams: false });
      res.statusCode = 200;
      res.setHeader('Content-Type', 'application/pdf');
      res.setHeader('Content-Disposition', `attachment; filename="DOSSIE_ASSINATURAS_${payrollCompetencia}.pdf"`);
      res.setHeader('Cache-Control', 'private, no-store, max-age=0');
      return res.end(pdfBytes);
    }

'''
              text = text.replace(marker, action + marker, 1)

          admin.write_text(text, encoding='utf-8')

          ui = Path('src/components/payroll/PayrollPortalAdminModule.tsx')
          text = ui.read_text(encoding='utf-8')
          start = text.find('  const dossier = async (row: any) => {')
          if start < 0:
              raise SystemExit('dossier function start not found')
          end = text.find('\n  };', start)
          if end < 0:
              raise SystemExit('dossier function end not found')
          end += len('\n  };')

          new_dossier = r'''  const dossier = async (row: any) => {
    if (row.signature_status !== 'ASSINADO') return toast.error('O dossiê final exige assinatura concluída.');
    try {
      const { data: sessionData } = await supabase.auth.getSession();
      const token = sessionData.session?.access_token;
      if (!token) throw new Error('Sessão administrativa expirada. Entre novamente.');

      const response = await fetch('/api/payroll-admin', {
        method: 'POST',
        headers: { 'content-type': 'application/json', authorization: `Bearer ${token}` },
        body: JSON.stringify({ action: 'dossier-pdf', document_id: row.document_id }),
      });
      if (!response.ok) {
        const result = await response.json().catch(() => ({}));
        throw new Error(result.error || `Falha ${response.status} ao gerar o dossiê.`);
      }

      const blob = await response.blob();
      if (!blob.size) throw new Error('O dossiê foi gerado vazio.');
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `DOSSIE_ASSINATURAS_${safeFile(row.employee_name || 'FUNCIONARIO')}_${competencia}.pdf`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      window.setTimeout(() => URL.revokeObjectURL(url), 1500);
      toast.success('Dossiê gerado e baixado.');
    } catch (error: any) {
      toast.error(error?.message || 'Não foi possível gerar o dossiê.');
    }
  };'''
          ui.write_text(text[:start] + new_dossier + text[end:], encoding='utf-8')

      - name: Install and build
        run: |
          npm install --legacy-peer-deps --no-package-lock --no-audit --no-fund
          npm run build

      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/patch-payroll-authoritative-time-dossier.yml
          git add -A
          git commit -m "fix(payroll): gerar dossiê PDF no servidor"
          git push
