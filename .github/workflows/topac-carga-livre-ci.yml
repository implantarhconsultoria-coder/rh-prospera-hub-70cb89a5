name: TOPAC Carga Livre — validação

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/components/AlmoxarifadoDesktopV4.tsx'
      - 'src/lib/almoxarifadoCargaLivre*'
      - 'src/lib/almoxarifadoWithdrawalReceipt.ts'
      - 'supabase/migrations/*almox_cargas_livres*'
      - '.github/workflows/topac-carga-livre-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  valida-carga-livre:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar sem alterar lockfile legado
        run: npm install --package-lock=false --no-audit --no-fund
      - name: Testar interpretação e ficha
        run: npx vitest run src/lib/almoxarifadoCargaLivre.test.ts src/lib/almoxarifadoWithdrawalReceiptLivre.test.ts
      - name: Lint da lógica nova
        run: npx eslint src/lib/almoxarifadoCargaLivre.ts src/lib/almoxarifadoCargaLivre.test.ts src/lib/almoxarifadoWithdrawalReceipt.ts
      - name: Build completo
        run: npm run build
