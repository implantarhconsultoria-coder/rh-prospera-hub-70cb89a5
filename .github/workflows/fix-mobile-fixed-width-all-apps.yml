name: Fix mobile fixed width all apps

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-mobile-fixed-width-all-apps.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Fixar todos os apps mobile na largura da tela
        run: |
          python - <<'PY'
          from pathlib import Path

          style = r'''
  <style id="topac-mobile-fixed-layout">
    @media (max-width: 900px) {
      html,
      body,
      #root {
        width: 100% !important;
        min-width: 0 !important;
        max-width: 100vw !important;
        margin: 0 !important;
        overflow-x: hidden !important;
        overscroll-behavior-x: none !important;
        touch-action: pan-y;
      }

      body,
      #root,
      #root > *,
      main,
      main > *,
      .topac-neon-skin,
      .topac-neon-skin main {
        box-sizing: border-box !important;
        min-width: 0 !important;
        max-width: 100% !important;
      }

      .topac-neon-skin,
      .topac-neon-skin main,
      .topac-neon-skin main > div {
        width: 100% !important;
        overflow-x: hidden !important;
      }

      #root * {
        box-sizing: border-box;
      }

      main [class*="grid"],
      main [class*="flex"],
      main article,
      main section,
      main header,
      main footer,
      main form,
      main fieldset,
      main nav {
        min-width: 0 !important;
        max-width: 100% !important;
      }

      main img,
      main video,
      main canvas,
      main svg,
      main input,
      main select,
      main textarea {
        max-width: 100% !important;
      }

      main pre,
      main code {
        max-width: 100% !important;
        white-space: pre-wrap !important;
        overflow-wrap: anywhere !important;
      }

      main .overflow-x-auto,
      main [class*="overflow-x-auto"] {
        width: 100% !important;
        max-width: 100% !important;
        overscroll-behavior-x: contain;
      }
    }
  </style>
'''

          for name in ('index.html', 'mecanicos.html'):
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              if 'id="topac-mobile-fixed-layout"' not in s:
                  s = s.replace('</head>', style + '\n</head>', 1)
              p.write_text(s, encoding='utf-8')

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          needle = """          const parent = link.parentElement;\n          if (parent.querySelector('[data-topac-mechanic-share=\"true\"]')) return;"""
          replacement = """          const parent = link.parentElement;\n\n          if (window.innerWidth <= 900) {\n            parent.style.display = 'grid';\n            parent.style.gridTemplateColumns = 'repeat(2, minmax(0, 1fr))';\n            parent.style.gap = '8px';\n            parent.style.width = '100%';\n            parent.style.maxWidth = '100%';\n            parent.style.minWidth = '0';\n            parent.style.overflow = 'hidden';\n          }\n\n          if (parent.querySelector('[data-topac-mechanic-share=\"true\"]')) return;"""
          if needle in s and 'parent.style.gridTemplateColumns' not in s:
              s = s.replace(needle, replacement, 1)

          needle2 = """          parent.append(copyButton, shareButton);"""
          replacement2 = """          parent.append(copyButton, shareButton);\n\n          if (window.innerWidth <= 900) {\n            [...parent.children].forEach((item) => {\n              item.style.width = '100%';\n              item.style.maxWidth = '100%';\n              item.style.minWidth = '0';\n              item.style.margin = '0';\n              item.style.justifyContent = 'center';\n              item.style.paddingLeft = '6px';\n              item.style.paddingRight = '6px';\n              item.style.fontSize = '10px';\n              item.style.whiteSpace = 'nowrap';\n              item.style.overflow = 'hidden';\n              item.style.textOverflow = 'ellipsis';\n            });\n          }"""
          if needle2 in s and 'item.style.textOverflow' not in s:
              s = s.replace(needle2, replacement2, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit correction
        run: |
          if git diff --quiet; then
            echo "Nada para corrigir"
            exit 0
          fi
          git config user.name "TOPAC Automation"
          git config user.email "actions@github.com"
          git add index.html mecanicos.html
          git commit -m "fix: travar apps mobile na largura da tela"
          git push origin main
