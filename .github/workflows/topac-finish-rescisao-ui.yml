name: TOPAC Finish Rescisao UI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/topac-pdf-rescisao-20260807
          fetch-depth: 0
      - name: Apply final semantic fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'pattern not found in {path}: {old[:160]!r}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          path = 'src/lib/rescisaoCalc.ts'
          replace(path,
          """  tercoFeriasVencidas: number;\n  tercoFeriasProporcionais: number;""",
          """  tercoFeriasVencidas: number;\n  tercoFeriasEmAberto: number;\n  tercoFeriasProporcionais: number;""")
          replace(path,
          """  const vacationCompletedValue = round2(fullVacationPeriods.reduce((sum, period) => sum + period.valorFerias, 0));\n  const vacationProportionalValue = round2(proportionalVacationPeriods.reduce((sum, period) => sum + period.valorFerias, 0));\n  const vacationOpenValue = round2(fullVacationPeriods.filter((period) => period.situacao !== 'Férias vencidas').reduce((sum, period) => sum + period.valorFerias, 0));\n  const vacationDoubleAdditional = round2(fullVacationPeriods.reduce((sum, period) => sum + period.adicionalDobro, 0));\n  const thirdCompleted = round2(fullVacationPeriods.reduce((sum, period) => sum + period.tercoConstitucional, 0));\n  const thirdProportional = round2(proportionalVacationPeriods.reduce((sum, period) => sum + period.tercoConstitucional, 0));\n  const totalVacation = round2(vacationCompletedValue + vacationProportionalValue + thirdCompleted + thirdProportional);""",
          """  const expiredVacationPeriods = fullVacationPeriods.filter((period) => period.situacao === 'Férias vencidas');\n  const openVacationPeriods = fullVacationPeriods.filter((period) => period.situacao !== 'Férias vencidas');\n  const vacationExpiredValue = round2(expiredVacationPeriods.reduce((sum, period) => sum + period.valorFerias, 0));\n  const vacationOpenValue = round2(openVacationPeriods.reduce((sum, period) => sum + period.valorFerias, 0));\n  const vacationProportionalValue = round2(proportionalVacationPeriods.reduce((sum, period) => sum + period.valorFerias, 0));\n  const vacationDoubleAdditional = round2(expiredVacationPeriods.reduce((sum, period) => sum + period.adicionalDobro, 0));\n  const thirdExpired = round2(expiredVacationPeriods.reduce((sum, period) => sum + period.tercoConstitucional, 0));\n  const thirdOpen = round2(openVacationPeriods.reduce((sum, period) => sum + period.tercoConstitucional, 0));\n  const thirdProportional = round2(proportionalVacationPeriods.reduce((sum, period) => sum + period.tercoConstitucional, 0));\n  const totalVacation = round2(vacationExpiredValue + vacationOpenValue + vacationProportionalValue + thirdExpired + thirdOpen + thirdProportional);""")
          replace(path,
          """    feriasVencidas: vacationCompletedValue,\n    feriasEmAberto: vacationOpenValue,""",
          """    feriasVencidas: vacationExpiredValue,\n    feriasEmAberto: vacationOpenValue,""")
          replace(path,
          """    tercoFeriasVencidas: thirdCompleted,\n    tercoFeriasProporcionais: thirdProportional,\n    tercoFerias: round2(thirdCompleted + thirdProportional),""",
          """    tercoFeriasVencidas: thirdExpired,\n    tercoFeriasEmAberto: thirdOpen,\n    tercoFeriasProporcionais: thirdProportional,\n    tercoFerias: round2(thirdExpired + thirdOpen + thirdProportional),""")

          path = 'src/pages/RescisaoPage.tsx'
          replace(path,
          """    tercoFeriasVencidas: Number(row.terco_ferias_vencidas) || terco,\n    tercoFeriasProporcionais: Number(row.terco_ferias_proporcionais) || 0,""",
          """    tercoFeriasVencidas: Number(row.terco_ferias_vencidas) || 0,\n    tercoFeriasEmAberto: Number(row.snapshot_json?.tercoFeriasEmAberto) || Math.max(0, terco - (Number(row.terco_ferias_vencidas) || 0) - (Number(row.terco_ferias_proporcionais) || 0)),\n    tercoFeriasProporcionais: Number(row.terco_ferias_proporcionais) || 0,""")
          replace(path,
          """  const overdueDays = resultado?.periodosFerias\n    .filter((period) => period.situacao === 'Férias vencidas' || period.situacao === 'Em aberto' || period.situacao === 'Parcialmente usufruído')\n    .reduce((sum, period) => sum + period.saldoDias, 0) || 0;""",
          """  const overdueDays = resultado?.periodosFerias\n    .filter((period) => period.situacao === 'Férias vencidas')\n    .reduce((sum, period) => sum + period.saldoDias, 0) || 0;""")
          replace(path,
          """            {emp && resultado && <>\n              <div className=\"grid grid-cols-2 lg:grid-cols-4 gap-3 mt-2\">""",
          """            {emp && resultado && <>\n              <div className=\"mt-2\">\n                <div className=\"font-bold text-base\">Férias calculadas automaticamente</div>\n                <div className=\"text-xs text-muted-foreground\">Períodos aquisitivos cruzados com o histórico do módulo de Férias.</div>\n              </div>\n              <div className=\"grid grid-cols-2 lg:grid-cols-4 gap-3\">""")
          replace(path,
          """<Card className=\"p-3\"><p className=\"text-xs text-muted-foreground\">FÉRIAS VENCIDAS / EM ABERTO</p><p className=\"text-xl font-bold\">{overdueDays.toLocaleString('pt-BR')} dias</p><p className=\"text-xs\">{formatCurrency(resultado.feriasVencidas + resultado.tercoFeriasVencidas)}</p></Card>""",
          """<Card className=\"p-3\"><p className=\"text-xs text-muted-foreground\">FÉRIAS VENCIDAS</p><p className=\"text-xl font-bold\">{overdueDays.toLocaleString('pt-BR')} dias</p><p className=\"text-xs\">{formatCurrency(resultado.feriasVencidas + resultado.tercoFeriasVencidas)}</p></Card>""")
          replace(path,
          """                <div className=\"flex justify-between\"><span>Férias períodos completos/vencidos + 1/3</span><span>{formatCurrency(resultado.feriasVencidas + resultado.tercoFeriasVencidas)}</span></div>\n                <div className=\"flex justify-between\"><span>Férias proporcionais + 1/3</span><span>{formatCurrency(resultado.feriasProporcionais + resultado.tercoFeriasProporcionais)}</span></div>""",
          """                <div className=\"flex justify-between\"><span>Férias vencidas + 1/3</span><span>{formatCurrency(resultado.feriasVencidas + resultado.tercoFeriasVencidas)}</span></div>\n                <div className=\"flex justify-between\"><span>Férias adquiridas em aberto + 1/3</span><span>{formatCurrency(resultado.feriasEmAberto + resultado.tercoFeriasEmAberto)}</span></div>\n                <div className=\"flex justify-between\"><span>Férias proporcionais + 1/3</span><span>{formatCurrency(resultado.feriasProporcionais + resultado.tercoFeriasProporcionais)}</span></div>""")
          replace(path,
          """        terco_ferias: resultado.tercoFerias, terco_ferias_vencidas: resultado.tercoFeriasVencidas,\n        terco_ferias_proporcionais: resultado.tercoFeriasProporcionais,""",
          """        terco_ferias: resultado.tercoFerias, terco_ferias_vencidas: resultado.tercoFeriasVencidas,\n        terco_ferias_proporcionais: resultado.tercoFeriasProporcionais,""")

          path = 'src/lib/rescisaoPdf.ts'
          replace(path,
          """      <tr><td>Férias de períodos completos / vencidos</td><td class=\"n\">${money(result.feriasVencidas)}</td></tr>\n      <tr><td>Férias proporcionais</td><td class=\"n\">${money(result.feriasProporcionais)}</td></tr>\n      <tr><td>1/3 férias completas/vencidas</td><td class=\"n\">${money(result.tercoFeriasVencidas)}</td></tr>\n      <tr><td>1/3 férias proporcionais</td><td class=\"n\">${money(result.tercoFeriasProporcionais)}</td></tr>""",
          """      <tr><td>Férias vencidas</td><td class=\"n\">${money(result.feriasVencidas)}</td></tr>\n      <tr><td>Férias adquiridas em aberto</td><td class=\"n\">${money(result.feriasEmAberto)}</td></tr>\n      <tr><td>Férias proporcionais</td><td class=\"n\">${money(result.feriasProporcionais)}</td></tr>\n      <tr><td>1/3 férias vencidas</td><td class=\"n\">${money(result.tercoFeriasVencidas)}</td></tr>\n      <tr><td>1/3 férias em aberto</td><td class=\"n\">${money(result.tercoFeriasEmAberto)}</td></tr>\n      <tr><td>1/3 férias proporcionais</td><td class=\"n\">${money(result.tercoFeriasProporcionais)}</td></tr>""")
          replace(path,
          """  line('Ferias periodos completos/vencidos', money(result.feriasVencidas));\n  line('Ferias proporcionais', money(result.feriasProporcionais));""",
          """  line('Ferias vencidas', money(result.feriasVencidas));\n  line('Ferias adquiridas em aberto', money(result.feriasEmAberto));\n  line('Ferias proporcionais', money(result.feriasProporcionais));""")
          PY
      - name: Validate semantic fix
        run: |
          npm ci
          npx vitest run src/lib/__tests__/rescisaoCalc.test.ts
          npx eslint src/lib/rescisaoCalc.ts src/lib/rescisaoPdf.ts src/pages/RescisaoPage.tsx --rule '@typescript-eslint/no-explicit-any: off' --rule 'react-hooks/exhaustive-deps: off'
          npm run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/rescisaoCalc.ts src/lib/rescisaoPdf.ts src/pages/RescisaoPage.tsx
          git commit -m "fix: separar férias vencidas e adquiridas em aberto"
          git push origin HEAD:agent/topac-pdf-rescisao-20260807
