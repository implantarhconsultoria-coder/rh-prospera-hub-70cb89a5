name: PR70 E2E Real

on:
  push:
    branches:
      - test/pr70-e2e-real-20260806

permissions:
  contents: read

jobs:
  real-email-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://djfjnxmbvjgweqzjvqtr.supabase.co
      SUPABASE_KEY: sb_publishable_DHu9U7RSOV8uPwW2XXtH8A_ek7QfU_Z
      STORAGE_BUCKET: email-anexos-temporarios
      PREVIEW_ORIGIN: https://rh-prospera-hub-70cb89a5-dbow4q3qx.vercel.app
      PREVIEW_SHARE_URL: https://rh-prospera-hub-70cb89a5-dbow4q3qx.vercel.app/?_vercel_share=fE7VExX8LOsQ95Q6aEXm3wzkNIA84Nfn
      RECIPIENT: implantarh.consultoria@gmail.com

    steps:
      - name: Checkout exact PR code
        uses: actions/checkout@v4

      - name: Create authenticated technical user
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          TEST_EMAIL="implantarh.consultoria+topac-pr70-${GITHUB_RUN_ID}@gmail.com"
          TEST_PASSWORD="$(openssl rand -hex 24)Aa1!"
          echo "::add-mask::$TEST_PASSWORD"

          SIGNUP_BODY=$(python3 - <<PY
          import json
          print(json.dumps({
            "email": "${TEST_EMAIL}",
            "password": "${TEST_PASSWORD}",
            "data": {"nome_completo": "Teste Técnico PR70", "origem": "pr70-e2e"}
          }))
          PY
          )

          curl -sS -o signup.json -w '%{http_code}' \
            -X POST "$SUPABASE_URL/auth/v1/signup" \
            -H "apikey: $SUPABASE_KEY" \
            -H "content-type: application/json" \
            --data "$SIGNUP_BODY" > signup.status

          USER_ID=$(jq -r '.user.id // empty' signup.json)
          if [ -z "$USER_ID" ]; then
            echo "Signup não criou usuário."
            cat signup.json
            exit 1
          fi

          ACCESS_TOKEN=$(jq -r '.access_token // empty' signup.json)
          for attempt in $(seq 1 90); do
            if [ -n "$ACCESS_TOKEN" ]; then break; fi
            sleep 5
            TOKEN_BODY=$(python3 - <<PY
          import json
          print(json.dumps({"email": "${TEST_EMAIL}", "password": "${TEST_PASSWORD}"}))
          PY
            )
            curl -sS -o token.json \
              -X POST "$SUPABASE_URL/auth/v1/token?grant_type=password" \
              -H "apikey: $SUPABASE_KEY" \
              -H "content-type: application/json" \
              --data "$TOKEN_BODY"
            ACCESS_TOKEN=$(jq -r '.access_token // empty' token.json)
          done

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "Usuário criado, mas não confirmado dentro da janela do teste."
            echo "test_email=$TEST_EMAIL" >> "$GITHUB_OUTPUT"
            echo "user_id=$USER_ID" >> "$GITHUB_OUTPUT"
            exit 2
          fi

          echo "::add-mask::$ACCESS_TOKEN"
          printf '%s' "$ACCESS_TOKEN" > access_token.txt
          printf '%s' "$TEST_PASSWORD" > test_password.txt
          echo "test_email=$TEST_EMAIL" >> "$GITHUB_OUTPUT"
          echo "user_id=$USER_ID" >> "$GITHUB_OUTPUT"
          echo "Usuário técnico autenticado: $USER_ID"

      - name: Generate valid PNG above Vercel payload limit
        id: file
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, struct, zlib
          from pathlib import Path

          width, height = 1600, 1200
          pixels = hashlib.shake_256(b'TOPAC-RH-PRO-PR70-E2E-REAL').digest(width * height * 3)
          rows = bytearray()
          stride = width * 3
          for y in range(height):
              rows.append(0)
              rows.extend(pixels[y * stride:(y + 1) * stride])

          def chunk(kind: bytes, data: bytes) -> bytes:
              return struct.pack('>I', len(data)) + kind + data + struct.pack('>I', zlib.crc32(kind + data) & 0xffffffff)

          png = (
              b'\x89PNG\r\n\x1a\n'
              + chunk(b'IHDR', struct.pack('>IIBBBBB', width, height, 8, 2, 0, 0, 0))
              + chunk(b'IDAT', zlib.compress(bytes(rows), level=0))
              + chunk(b'IEND', b'')
          )
          path = Path('topac-pr70-e2e-real.png')
          path.write_bytes(png)
          digest = hashlib.sha256(png).hexdigest()
          meta = {
              'filename': path.name,
              'size_bytes': len(png),
              'sha256': digest,
              'width': width,
              'height': height,
              'valid_png_signature': png.startswith(b'\x89PNG\r\n\x1a\n'),
          }
          Path('file_meta.json').write_text(json.dumps(meta, indent=2), encoding='utf-8')
          print(json.dumps(meta))
          if len(png) <= 4_718_592:
              raise SystemExit('Arquivo não ultrapassou 4,5 MiB')
          if len(png) > 20 * 1024 * 1024:
              raise SystemExit('Arquivo ultrapassou 20 MiB')
          PY
          echo "size_bytes=$(jq -r .size_bytes file_meta.json)" >> "$GITHUB_OUTPUT"
          echo "sha256=$(jq -r .sha256 file_meta.json)" >> "$GITHUB_OUTPUT"

      - name: Upload file to private Storage with authenticated session
        id: upload
        shell: bash
        run: |
          set -euo pipefail
          ACCESS_TOKEN=$(cat access_token.txt)
          USER_ID='${{ steps.auth.outputs.user_id }}'
          STORAGE_PATH="$USER_ID/2026-08-06/topac-pr70-e2e-${GITHUB_RUN_ID}.png"
          UPLOAD_STATUS=$(curl -sS -o upload.json -w '%{http_code}' \
            -X POST "$SUPABASE_URL/storage/v1/object/$STORAGE_BUCKET/$STORAGE_PATH" \
            -H "apikey: $SUPABASE_KEY" \
            -H "authorization: Bearer $ACCESS_TOKEN" \
            -H "content-type: image/png" \
            -H "x-upsert: false" \
            --data-binary @topac-pr70-e2e-real.png)
          if [ "$UPLOAD_STATUS" != "200" ]; then
            echo "Upload falhou com HTTP $UPLOAD_STATUS"
            cat upload.json
            exit 1
          fi
          echo "storage_path=$STORAGE_PATH" >> "$GITHUB_OUTPUT"
          echo "Upload autenticado concluído: $STORAGE_PATH"

      - name: Establish Vercel preview access cookie
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -L -c vercel.cookies -b vercel.cookies "$PREVIEW_SHARE_URL" -o preview-root.html
          test -s vercel.cookies
          echo "Cookie de homologação estabelecido."

      - name: Send real email through PR70 Function
        id: send
        shell: bash
        run: |
          set -euo pipefail
          ACCESS_TOKEN=$(cat access_token.txt)
          SUBJECT="TOPAC PR70 E2E REAL ${GITHUB_RUN_ID}"
          STORAGE_PATH='${{ steps.upload.outputs.storage_path }}'
          SIZE_BYTES='${{ steps.file.outputs.size_bytes }}'
          TEST_EMAIL='${{ steps.auth.outputs.test_email }}'

          python3 - <<PY
          import json
          payload = {
            "to": ["${RECIPIENT}"],
            "cc": [],
            "subject": "${SUBJECT}",
            "body": "Homologação real da PR #70. Anexo PNG válido acima de 4,5 MB enviado pelo motor TOPAC RH PRO via Supabase Storage e URL assinada.",
            "attachments": [{
              "storageBucket": "${STORAGE_BUCKET}",
              "storagePath": "${STORAGE_PATH}",
              "attachmentName": "topac-pr70-e2e-real.png",
              "attachmentContentType": "image/png",
              "attachmentSize": int("${SIZE_BYTES}"),
              "documentName": "Homologação PR70 E2E"
            }],
            "senderName": "Teste Técnico PR70",
            "senderEmail": "${TEST_EMAIL}",
            "moduleOrigin": "homologacao_pr70",
            "documentName": "Homologação PR70 E2E"
          }
          open('request.json', 'w', encoding='utf-8').write(json.dumps(payload, ensure_ascii=False))
          PY

          SEND_STATUS=$(curl -sS -o send-response.json -w '%{http_code}' \
            -X POST "$PREVIEW_ORIGIN/api/send-email-pdf" \
            -c vercel.cookies -b vercel.cookies \
            -H "content-type: application/json; charset=utf-8" \
            -H "authorization: Bearer $ACCESS_TOKEN" \
            --data-binary @request.json)
          cat send-response.json
          if [ "$SEND_STATUS" != "200" ] || [ "$(jq -r '.ok // false' send-response.json)" != "true" ]; then
            echo "Function retornou HTTP $SEND_STATUS"
            exit 1
          fi
          echo "subject=$SUBJECT" >> "$GITHUB_OUTPUT"
          echo "send_status=$SEND_STATUS" >> "$GITHUB_OUTPUT"
          echo "Envio aceito pela Function e pelo provedor."

      - name: Confirm automatic Storage cleanup
        id: cleanup
        shell: bash
        run: |
          set -euo pipefail
          ACCESS_TOKEN=$(cat access_token.txt)
          STORAGE_PATH='${{ steps.upload.outputs.storage_path }}'
          CLEANUP_STATUS=$(curl -sS -o cleanup-response.bin -w '%{http_code}' \
            "$SUPABASE_URL/storage/v1/object/$STORAGE_BUCKET/$STORAGE_PATH" \
            -H "apikey: $SUPABASE_KEY" \
            -H "authorization: Bearer $ACCESS_TOKEN")
          echo "cleanup_http_status=$CLEANUP_STATUS" >> "$GITHUB_OUTPUT"
          if [ "$CLEANUP_STATUS" != "400" ] && [ "$CLEANUP_STATUS" != "404" ]; then
            echo "Objeto ainda acessível; HTTP $CLEANUP_STATUS"
            exit 1
          fi
          echo "Objeto temporário removido automaticamente."

      - name: Build evidence metadata
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          meta = {}
          if Path('file_meta.json').exists():
              meta.update(json.loads(Path('file_meta.json').read_text()))
          meta.update({
              'run_id': os.environ.get('GITHUB_RUN_ID'),
              'commit_sha': os.environ.get('GITHUB_SHA'),
              'recipient': os.environ.get('RECIPIENT'),
              'test_email': '${{ steps.auth.outputs.test_email }}',
              'user_id': '${{ steps.auth.outputs.user_id }}',
              'storage_path': '${{ steps.upload.outputs.storage_path }}',
              'subject': '${{ steps.send.outputs.subject }}',
              'send_http_status': '${{ steps.send.outputs.send_status }}',
              'cleanup_http_status': '${{ steps.cleanup.outputs.cleanup_http_status }}',
          })
          if Path('send-response.json').exists():
              try: meta['provider_response'] = json.loads(Path('send-response.json').read_text())
              except Exception: pass
          Path('e2e-evidence.json').write_text(json.dumps(meta, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(meta, ensure_ascii=False))
          PY

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr70-e2e-real-evidence-${{ github.run_id }}
          path: |
            topac-pr70-e2e-real.png
            file_meta.json
            request.json
            send-response.json
            e2e-evidence.json
          if-no-files-found: warn
          retention-days: 2
