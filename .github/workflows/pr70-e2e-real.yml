name: PR70 Resend Delivery Status

on:
  push:
    branches: [test/pr70-e2e-real-20260806]

permissions:
  contents: read

jobs:
  resend-delivery-status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PREVIEW_ORIGIN: https://rh-prospera-hub-70cb89a5-9kezi9q8o.vercel.app
      PREVIEW_SHARE_URL: https://rh-prospera-hub-70cb89a5-9kezi9q8o.vercel.app/?_vercel_share=Ja5GuuxMG0Wq4XUQQihVWGitxi2d8Mgp
      RESEND_EMAIL_ID: 9c811c04-11da-424a-8de9-766f8810a61e

    steps:
      - name: Establish protected preview session
        run: |
          set -euo pipefail
          curl -sS -L -c vercel.cookies -b vercel.cookies "$PREVIEW_SHARE_URL" -o preview-root.html
          test -s vercel.cookies

      - name: Read delivery state from Resend
        run: |
          set -euo pipefail
          STATUS=$(curl -sS -o resend-status.json -w '%{http_code}' \
            -c vercel.cookies -b vercel.cookies \
            "$PREVIEW_ORIGIN/api/pr70-resend-status?id=$RESEND_EMAIL_ID")
          cat resend-status.json
          test "$STATUS" = 200
          test "$(jq -r '.ok // false' resend-status.json)" = true

      - name: Upload delivery evidence
        uses: actions/upload-artifact@v4
        with:
          name: pr70-resend-delivery-status-${{ github.run_id }}
          path: resend-status.json
          retention-days: 2
