name: Corrigir datas do aviso de ferias

on:
  push:
    paths:
      - '.github/workflows/fix-ferias-date-only.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Corrigir datas locais e retorno
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          page = Path('src/pages/AvisoFeriasPage.tsx')
          text = page.read_text(encoding='utf-8')

          replacements = [
            ("""  const calcRetorno = () => {
    if (!inicioFerias) return '';
    return addDaysISO(inicioFerias, Math.max(0, diasFerias - 1));
  };
  const retorno = calcRetorno();""", """  const calcFimFerias = () => {
    if (!inicioFerias) return '';
    return addDaysISO(inicioFerias, Math.max(0, diasFerias - 1));
  };
  const fimFerias = calcFimFerias();
  const retorno = inicioFerias ? addDaysISO(inicioFerias, Math.max(0, diasFerias)) : '';"""),
            ("if (!retorno) { toast.error('Informe o periodo de ferias'); return null; }", "if (!fimFerias || !retorno) { toast.error('Informe o periodo de ferias'); return null; }"),
            ("const statusAtual = feriasPeriodoStatus(inicioFerias, retorno);", "const statusAtual = feriasPeriodoStatus(inicioFerias, fimFerias);"),
            ("const observacao = `Ferias de ${diasFerias} dias. Inicio: ${formatDate(inicioFerias)}. Fim/retorno previsto: ${formatDate(retorno)}.`;", "const observacao = `Ferias de ${diasFerias} dias. Inicio: ${formatDate(inicioFerias)}. Ultimo dia: ${formatDate(fimFerias)}. Retorno previsto: ${formatDate(retorno)}.`;"),
            ("periodo_gozo_fim: retorno,", "periodo_gozo_fim: fimFerias,"),
            ("inicioFerias && retorno ? { inicio: inicioFerias, fim: retorno, dias: diasFerias } : undefined,", "inicioFerias && fimFerias ? { inicio: inicioFerias, fim: fimFerias, dias: diasFerias } : undefined,"),
            (">Fim/retorno</span>", ">Ultimo dia</span>"),
            (">Retorno Previsto</label>", ">Retorno ao Trabalho</label>"),
          ]

          for old, new in replacements:
            if old not in text:
              print(f'AVISO: trecho nao encontrado: {old[:70]}')
            text = text.replace(old, new)

          text = text.replace(
            "`${emp.observacoes || ''}\\n[FERIAS] Inicio: ${inicioFerias} | Fim/retorno previsto: ${retorno} | ${diasFerias} dias | Status: ${statusAtual?.label || 'Ferias marcadas'}`",
            "`${emp.observacoes || ''}\\n[FERIAS] Inicio: ${inicioFerias} | Ultimo dia: ${fimFerias} | Retorno: ${retorno} | ${diasFerias} dias | Status: ${statusAtual?.label || 'Ferias marcadas'}`"
          )

          page.write_text(text, encoding='utf-8')

          calc = Path('src/lib/calculations.ts')
          ctext = calc.read_text(encoding='utf-8')
          old = """export const formatDate = (d: string) => {
  if (!d) return '—';
  return new Date(d).toLocaleDateString('pt-BR');
};"""
          new = """export const formatDate = (d: string) => {
  if (!d) return '—';
  const match = String(d).match(/^(\\d{4})-(\\d{2})-(\\d{2})/);
  if (match) return `${match[3]}/${match[2]}/${match[1]}`;
  return new Date(d).toLocaleDateString('pt-BR');
};"""
          if old not in ctext:
            print('AVISO: formatDate antigo nao encontrado')
          calc.write_text(ctext.replace(old, new), encoding='utf-8')
          PY

      - name: Publicar correcao
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/AvisoFeriasPage.tsx src/lib/calculations.ts
          git diff --cached --quiet && exit 0
          git commit -m "Corrige datas de inicio fim e retorno das ferias"
          git push origin main
