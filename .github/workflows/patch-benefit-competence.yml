name: Patch Benefit Competence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-benefit-competence.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply benefit competence patch
        run: python scripts/patch_benefit_competence.py
      - name: Validate production build
        run: |
          npm install --legacy-peer-deps --package-lock=false
          npm run build
      - name: Commit benefit competence fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/payroll/BenefitSignatureGenerator.tsx
          git commit -m "fix(payroll): usar competência real de VR VT na assinatura"
          git push origin HEAD:main
